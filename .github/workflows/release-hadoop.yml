name: Release Hadoop

on:
  workflow_run:
    workflows:
      - Test Hadoop
    types:
      - completed
  workflow_dispatch:
    inputs:
      test_run_id:
        description: Successful Test Hadoop run ID containing tested RPMs
        required: true
        type: string

permissions:
  contents: write
  actions: read
  pull-requests: write

jobs:
  release:
    name: Assemble Hadoop release candidate
    if: >
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      RELEASE_ROOT: /tmp/bigdata-hadoop-release
      RELEASE_NAME: bigdata-1.0-hadoop-3.4.3-rc
      TEST_RUN_ID: ${{ github.event.workflow_run.id || inputs.test_run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download tested Hadoop RPMs
        uses: actions/download-artifact@v4
        with:
          name: hadoop-3.4.3-tested-rpms
          path: /tmp/tested-rpms
          run-id: ${{ env.TEST_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Hadoop test evidence
        uses: actions/download-artifact@v4
        with:
          name: hadoop-3.4.3-test-evidence
          path: /tmp/test-evidence
          run-id: ${{ env.TEST_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble release bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${RELEASE_ROOT}"
          mkdir -p "${RELEASE_ROOT}"/{rpms,evidence}

          find /tmp/tested-rpms -type f -name '*.rpm' -exec cp -v {} "${RELEASE_ROOT}/rpms/" \;
          cp -a /tmp/test-evidence/. "${RELEASE_ROOT}/evidence/"

          rpm_count=$(find "${RELEASE_ROOT}/rpms" -type f -name '*.rpm' | wc -l)
          test "${rpm_count}" -gt 0

          (
            cd "${RELEASE_ROOT}"
            find rpms -type f -name '*.rpm' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )

          {
            echo "schema: bigdata.release/v1"
            echo "name: ${RELEASE_NAME}"
            echo "component: hadoop"
            echo "component_version: 3.4.3"
            echo "bigtop_version: 3.6.0"
            echo "ambari_version: 3.0.0"
            echo "ambari_compatibility: ADAPTATION_REQUIRED"
            echo "os: openEuler 22.03 LTS SP4"
            echo "package_format: RPM"
            echo "source_commit: ${GITHUB_SHA}"
            echo "test_run_id: ${TEST_RUN_ID}"
            echo "rpm_count: ${rpm_count}"
            echo "status: RELEASE_CANDIDATE"
          } > "${RELEASE_ROOT}/release-manifest.yaml"

          tar -C "${RELEASE_ROOT}" -czf "/tmp/${RELEASE_NAME}.tar.gz" .
          sha256sum "/tmp/${RELEASE_NAME}.tar.gz" > "/tmp/${RELEASE_NAME}.tar.gz.sha256"
          cat "${RELEASE_ROOT}/release-manifest.yaml" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Hadoop release candidate
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_NAME }}
          path: |
            /tmp/bigdata-hadoop-release
            /tmp/${{ env.RELEASE_NAME }}.tar.gz
            /tmp/${{ env.RELEASE_NAME }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Prepare RPM repository tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y createrepo-c git-lfs

      - name: Checkout RPM repository base
        uses: actions/checkout@v4
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
        with:
          ref: main
          path: rpm-repository-pr
          lfs: false

      - name: Open and merge tested RPM pull request
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPONENT: hadoop
          VERSION: 3.4.3
          TEST_WORKFLOW_PATH: .github/workflows/test-hadoop.yml
          SOURCE_SHA: ${{ github.sha }}
          REPO_CHECKOUT: ${{ github.workspace }}/rpm-repository-pr
        run: bash "${GITHUB_WORKSPACE}/scripts/ci/open-tested-rpm-pr.sh"
