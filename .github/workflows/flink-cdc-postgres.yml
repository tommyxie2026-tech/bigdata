name: Flink CDC PostgreSQL Build and Test

on:
  pull_request:
    paths:
      - '.github/workflows/flink-cdc-postgres.yml'
      - 'scripts/flink-cdc-postgres/**'
      - 'scripts/cdc-lakehouse/**'
      - 'scripts/flink-cdc-mysql/protocol.py'
      - 'scripts/ci/retry-maven-downloads.sh'
  push:
    branches: [main]
    paths:
      - '.github/workflows/flink-cdc-postgres.yml'
      - 'scripts/flink-cdc-postgres/**'
      - 'scripts/cdc-lakehouse/**'
      - 'scripts/flink-cdc-mysql/protocol.py'
      - 'scripts/ci/retry-maven-downloads.sh'
  workflow_dispatch:
    inputs:
      rebuild_rpm:
        description: Explicitly rebuild instead of reusing identical successful RPM inputs
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
concurrency:
  group: flink-cdc-postgres-${{ github.ref }}
  cancel-in-progress: true
env:
  GIT_LFS_SKIP_SMUDGE: '1'

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.select.outputs.build }}
      rpm_run: ${{ steps.select.outputs.rpm_run }}
      identity: ${{ steps.select.outputs.identity }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Regression tests
        run: |
          python3 scripts/flink-cdc-postgres/test_select_rpm.py
          python3 scripts/flink-cdc-mysql/test_protocol.py
      - name: Find matching successful RPM build
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          REBUILD: ${{ inputs.rebuild_rpm || false }}
        run: python3 scripts/flink-cdc-postgres/select_rpm.py

  build:
    name: Build RPM flink-cdc-postgres 3.4.0
    needs: select
    if: needs.select.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/cache@v4
        with:
          path: /tmp/pg-maven-cache
          key: cdc-postgres-source-3.4.0-jdk11-v1
      - name: Compile pinned PostgreSQL source once
        run: |
          mkdir -p /tmp/pg-source /tmp/pg-maven-cache
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v /tmp/pg-source:/work -v /tmp/pg-maven-cache:/root/.m2 \
            openeuler/openeuler:22.03-lts-sp4 \
            bash /workspace/scripts/flink-cdc-postgres/compile.sh
      - name: Package compiled connector RPM
        env:
          BUILD_INPUT_IDENTITY: ${{ needs.select.outputs.identity }}
        run: |
          mkdir -p /tmp/pg-rpm
          docker run --rm \
            -e BUILD_RUN_ID="$GITHUB_RUN_ID" -e SOURCE_RUN_ID="$GITHUB_RUN_ID" \
            -e BUILD_INPUT_IDENTITY="$BUILD_INPUT_IDENTITY" \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v /tmp/pg-source/output:/source:ro -v /tmp/pg-rpm:/work \
            openeuler/openeuler:22.03-lts-sp4 \
            bash /workspace/scripts/flink-cdc-postgres/package.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flink-cdc-postgres-3.4.0-source-evidence
          path: /tmp/pg-source/output
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: flink-cdc-postgres-3.4.0-rpm
          path: /tmp/pg-rpm/output
          if-no-files-found: error
          retention-days: 30

  test:
    name: Test flink-cdc-postgres 3.4.0
    needs: [select, build]
    if: >-
      !cancelled() && needs.select.result == 'success' &&
      (needs.build.result == 'success' ||
       (needs.select.outputs.build == 'false' && needs.build.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/download-artifact@v4
        with:
          name: flink-cdc-postgres-3.4.0-rpm
          run-id: ${{ needs.select.outputs.rpm_run }}
          github-token: ${{ github.token }}
          path: connector-rpm
      - name: Checkout existing engine RPM repositories
        uses: actions/checkout@v4
        with:
          ref: main
          path: dependency-repository
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            repo/openeuler-22.03-lts-sp4/bigtop-3.6/flink/1.20.1/
            repo/openeuler-22.03-lts-sp4/bigtop-3.6/hadoop/3.4.3/
            repo/openeuler-22.03-lts-sp4/bigtop-3.6/common/3.6.0/
      - name: Fetch only required engine RPM closure
        run: |
          git -C dependency-repository lfs pull \
            --include='repo/openeuler-22.03-lts-sp4/bigtop-3.6/flink/1.20.1/**,repo/openeuler-22.03-lts-sp4/bigtop-3.6/hadoop/3.4.3/**,repo/openeuler-22.03-lts-sp4/bigtop-3.6/common/3.6.0/**' \
            --exclude=''
      - uses: actions/cache/restore@v4
        id: maven
        with:
          path: /tmp/pg-test-maven-cache
          key: cdc-postgres-smoke-flink1201-jdk11-v1
      - name: Start pinned logical replication fixture
        run: |
          set -euo pipefail
          docker run -d --name cdc-postgres -p 5432:5432 \
            -e POSTGRES_PASSWORD=cdc-fixture \
            postgres:14.15@sha256:2a453914efff6156786247b2399e6f9f18d7fc37e1ca5574a23aba172cf37d3e \
            -c wal_level=logical -c max_replication_slots=4 -c max_wal_senders=4
          for _ in $(seq 1 60); do
            if docker exec cdc-postgres pg_isready -U postgres; then exit 0; fi
            sleep 2
          done
          docker logs cdc-postgres
          exit 1
      - name: Clean install, exact WAL changelog and savepoint recovery
        env:
          BUILD_RUN: ${{ needs.select.outputs.rpm_run }}
          BUILD_INPUT_IDENTITY: ${{ needs.select.outputs.identity }}
        run: |
          mkdir -p /tmp/pg-evidence /tmp/pg-test-maven-cache
          docker run --rm --network host \
            -e BUILD_RUN_ID="$BUILD_RUN" -e TEST_RUN_ID="$GITHUB_RUN_ID" \
            -e BUILD_INPUT_IDENTITY="$BUILD_INPUT_IDENTITY" \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$GITHUB_WORKSPACE/connector-rpm:/rpm:ro" \
            -v "$GITHUB_WORKSPACE/dependency-repository/repo/openeuler-22.03-lts-sp4/bigtop-3.6:/dependencies:ro" \
            -v /tmp/pg-test-maven-cache:/root/.m2 -v /tmp/pg-evidence:/evidence \
            openeuler/openeuler:22.03-lts-sp4 \
            bash /workspace/scripts/flink-cdc-postgres/test.sh
      - uses: actions/cache/save@v4
        if: always() && steps.maven.outputs.cache-hit != 'true'
        with:
          path: /tmp/pg-test-maven-cache
          key: cdc-postgres-smoke-flink1201-jdk11-v1
      - name: Collect fixture logs and tear down replication slot
        if: always()
        run: |
          mkdir -p /tmp/pg-evidence
          docker logs cdc-postgres > /tmp/pg-evidence/postgres.log 2>&1 || true
          docker rm -f cdc-postgres || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flink-cdc-postgres-3.4.0-test-evidence
          path: /tmp/pg-evidence
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: flink-cdc-postgres-3.4.0-tested-rpms
          path: connector-rpm
          retention-days: 30

  candidate:
    name: Release Candidate flink-cdc-postgres 3.4.0
    needs: test
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && needs.test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: flink-cdc-postgres-3.4.0-tested-rpms
          path: candidate
      - uses: actions/download-artifact@v4
        with:
          name: flink-cdc-postgres-3.4.0-test-evidence
          path: test-evidence
      - name: Verify release candidate and test evidence
        run: |
          set -euo pipefail
          grep -qx 'status: PASS' test-evidence/evidence.md
          grep -qx 'retained_inactive_slot: PASS' test-evidence/evidence.md
          (cd candidate && sha256sum -c evidence/SHA256SUMS)
          cp test-evidence/evidence.md candidate/test-evidence.md
      - uses: actions/upload-artifact@v4
        with:
          name: flink-cdc-postgres-3.4.0-release-candidate
          path: candidate
          retention-days: 30

  promote:
    name: Open tested PostgreSQL RPM repository PR
    needs: [select, test, candidate]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      needs.select.result == 'success' && needs.test.result == 'success' &&
      needs.candidate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/checkout@v4
        with:
          ref: main
          path: repository
          lfs: false
      - uses: actions/download-artifact@v4
        with:
          name: flink-cdc-postgres-3.4.0-tested-rpms
          path: candidate
      - uses: actions/download-artifact@v4
        with:
          name: flink-cdc-postgres-3.4.0-test-evidence
          path: test-evidence
      - name: Open repository promotion PR without merging
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ needs.select.outputs.rpm_run }}
          BUILD_INPUT_IDENTITY: ${{ needs.select.outputs.identity }}
        run: bash scripts/flink-cdc-postgres/promote.sh
