name: Build Components

on:
  workflow_dispatch:
    inputs:
      start_component:
        description: First component to build, or RPM repository maintenance
        required: true
        default: zookeeper
        type: choice
        options:
          - zookeeper
          - hadoop
          - tez
          - hive
          - spark
          - hbase
          - kafka
          - flink
          - all
          - repo_maintenance
      promote_test_run_id:
        description: Existing successful Test run ID; when set, promote tested RPMs without rebuilding
        required: false
        default: ''
        type: string
      promote_version:
        description: Component version for an existing tested run
        required: false
        default: ''
        type: string
      promote_component:
        description: Component in an existing tested run (including ZooKeeper or Hadoop)
        required: false
        default: ''
        type: string
  push:
    branches:
      - main
    paths:
      - ".github/workflows/*components.yml"
      - ".github/workflows/build-one-component.yml"
      - ".github/workflows/check-component-repo.yml"
      - ".github/workflows/component-lifecycle.yml"
      - "scripts/ci/*.sh"
      - "scripts/ci/*component-repo-fast-path.py"
      - "scripts/ci/resolve-component-dependencies.py"
      - "scripts/ci/validate-components.py"
      - "!scripts/ci/*ambari*.sh"
      - "ci/components.yaml"

  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/*components.yml"
      - ".github/workflows/build-one-component.yml"
      - ".github/workflows/check-component-repo.yml"
      - ".github/workflows/component-lifecycle.yml"
      - "scripts/ci/*.sh"
      - "scripts/ci/*component-repo-fast-path.py"
      - "scripts/ci/resolve-component-dependencies.py"
      - "scripts/ci/validate-components.py"
      - "!scripts/ci/*ambari*.sh"
      - "ci/components.yaml"

permissions:
  contents: read
  actions: read

jobs:
  slim_repository:
    name: Deduplicate tested RPM repository
    if: github.event_name == 'workflow_dispatch' && inputs.start_component == 'repo_maintenance'
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout maintenance code
        uses: actions/checkout@v4

      - name: Prepare RPM repository tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y createrepo-c git-lfs

      - name: Checkout current RPM repository
        uses: actions/checkout@v4
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
        with:
          ref: main
          path: rpm-repository-pr
          lfs: false

      - name: Select runtime RPMs and rebuild metadata
        env:
          REPO_CHECKOUT: ${{ github.workspace }}/rpm-repository-pr
        run: |
          set -euo pipefail
          cd "${REPO_CHECKOUT}"
          git lfs install --local
          git switch -c "ci/slim-rpm-repo-${GITHUB_RUN_ID}"
          python3 "${GITHUB_WORKSPACE}/scripts/ci/slim-rpm-repo.py" \
            --repo-checkout "${REPO_CHECKOUT}"

      - name: Test split DNF repositories in clean openEuler
        env:
          REPO_CHECKOUT: ${{ github.workspace }}/rpm-repository-pr
        run: bash scripts/ci/test-slim-rpm-repo.sh

      - name: Document the split repository layout
        env:
          REPO_CHECKOUT: ${{ github.workspace }}/rpm-repository-pr
        run: cp repo/README.md "${REPO_CHECKOUT}/repo/README.md"

      - name: Open and merge RPM cleanup pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_CHECKOUT: ${{ github.workspace }}/rpm-repository-pr
        run: |
          set -euo pipefail
          cd "${REPO_CHECKOUT}"
          git add repo
          git diff --cached --check
          while IFS= read -r -d '' rpm; do
            [[ "${rpm}" == *.rpm ]] || continue
            [[ "$(git check-attr filter -- "${rpm}")" == *'filter: lfs' ]]
            [[ "$(git cat-file -s ":${rpm}")" -lt 300 ]]
          done < <(git diff --cached --name-only -z -- repo)
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'repo: keep one copy of tested runtime RPMs'
          git push origin "ci/slim-rpm-repo-${GITHUB_RUN_ID}"
          body_file="$(mktemp)"
          cat > "${body_file}" <<EOF
          Move shared Bigtop packages to common/, keep component RPMs only in their
          owning repositories, and remove source/debug/test/docs/devel packages.
          Validated with checksum checks and a clean openEuler DNF install.
          Maintenance run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          pr_url="$(gh pr create --repo "${GITHUB_REPOSITORY}" \
            --base main --head "ci/slim-rpm-repo-${GITHUB_RUN_ID}" \
            --title 'repo: deduplicate tested runtime RPMs' \
            --body-file "${body_file}")"
          echo "RPM cleanup PR: ${pr_url}" >> "${GITHUB_STEP_SUMMARY}"
          gh pr merge "${pr_url}" --repo "${GITHUB_REPOSITORY}" --squash

  promote_existing:
    name: Promote tested ${{ inputs.promote_component || inputs.start_component }} RPMs
    if: github.event_name == 'workflow_dispatch' && inputs.start_component != 'repo_maintenance' && inputs.promote_test_run_id != ''
    permissions:
      contents: write
      actions: read
      pull-requests: write
    uses: ./.github/workflows/release-components.yml
    with:
      component: ${{ inputs.promote_component || inputs.start_component }}
      version: ${{ inputs.promote_version }}
      test_run_id: ${{ inputs.promote_test_run_id }}

  zookeeper_repo_check:
    name: Check ZooKeeper 3.8.4 RPM repository
    if: >-
      github.event_name != 'workflow_dispatch' ||
      (inputs.promote_test_run_id == '' &&
       (inputs.start_component == 'zookeeper' || inputs.start_component == 'all'))
    uses: ./.github/workflows/check-component-repo.yml
    with:
      component: zookeeper
      version: 3.8.4

  zookeeper_build:
    name: Build zookeeper 3.8.4
    needs: zookeeper_repo_check
    if: ${{ always() && needs.zookeeper_repo_check.result == 'success' && needs.zookeeper_repo_check.outputs.already_current != 'true' }}
    uses: ./.github/workflows/build-one-component.yml
    with:
      component: zookeeper
      version: 3.8.4
      task: zookeeper-rpm

  zookeeper_test:
    name: Test zookeeper 3.8.4
    needs: zookeeper_build
    if: ${{ always() && needs.zookeeper_build.result == 'success' }}
    uses: ./.github/workflows/test-components.yml
    with:
      component: zookeeper
      version: 3.8.4
      build_run_id: ${{ format('{0}', github.run_id) }}

  zookeeper_release:
    name: Release zookeeper 3.8.4
    needs: zookeeper_test
    if: ${{ always() && needs.zookeeper_test.result == 'success' && github.event_name != 'pull_request' }}
    permissions:
      contents: write
      actions: read
      pull-requests: write
    uses: ./.github/workflows/release-components.yml
    with:
      component: zookeeper
      version: 3.8.4
      test_run_id: ${{ format('{0}', github.run_id) }}

  zookeeper_gate:
    name: Complete zookeeper 3.8.4 stage
    needs: [zookeeper_repo_check, zookeeper_build, zookeeper_test, zookeeper_release]
    if: >-
      always() &&
      (github.event_name != 'workflow_dispatch' ||
       (inputs.promote_test_run_id == '' &&
        (inputs.start_component == 'zookeeper' || inputs.start_component == 'all')))
    outputs:
      continue_chain: ${{ steps.gate.outputs.continue_chain }}
    runs-on: ubuntu-latest
    steps:
      - name: Accept verified existing RPMs or a completed release
        id: gate
        env:
          CHECK_RESULT: ${{ needs.zookeeper_repo_check.result }}
          ALREADY_CURRENT: ${{ needs.zookeeper_repo_check.outputs.already_current }}
          BUILD_RESULT: ${{ needs.zookeeper_build.result }}
          TEST_RESULT: ${{ needs.zookeeper_test.result }}
          RELEASE_RESULT: ${{ needs.zookeeper_release.result }}
          EVENT_NAME: ${{ github.event_name }}
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [[ "${CHECK_RESULT}" == success && "${ALREADY_CURRENT}" == true && "${BUILD_RESULT}" == skipped && "${TEST_RESULT}" == skipped && "${RELEASE_RESULT}" == skipped ]]; then
            echo 'continue_chain=true' >> "${GITHUB_OUTPUT}"
          elif [[ "${CHECK_RESULT}" == success && "${BUILD_RESULT}" == success && "${TEST_RESULT}" == success && ( "${RELEASE_RESULT}" == success || ( "${EVENT_NAME}" == pull_request && "${RELEASE_RESULT}" == skipped ) ) ]]; then
            echo 'continue_chain=true' >> "${GITHUB_OUTPUT}"
          elif [[ "${EVENT_NAME}" == pull_request && "${IS_FORK_PR}" == true && "${BUILD_RESULT}" == skipped && "${TEST_RESULT}" == skipped && "${RELEASE_RESULT}" == skipped ]]; then
            echo 'continue_chain=false' >> "${GITHUB_OUTPUT}"
            echo 'Build is intentionally unavailable to fork PRs.'
          else
            echo "ZooKeeper stage did not pass: check=${CHECK_RESULT}, repo=${ALREADY_CURRENT}, build=${BUILD_RESULT}, test=${TEST_RESULT}, release=${RELEASE_RESULT}" >&2
            exit 1
          fi

  hadoop_repo_check:
    name: Check Hadoop 3.4.3 RPM repository
    needs: zookeeper_gate
    if: >-
      always() &&
      (github.event_name != 'workflow_dispatch' || inputs.promote_test_run_id == '') &&
      ((github.event_name == 'workflow_dispatch' && inputs.start_component == 'hadoop') ||
       (needs.zookeeper_gate.result == 'success' && needs.zookeeper_gate.outputs.continue_chain == 'true'))
    uses: ./.github/workflows/check-component-repo.yml
    with:
      component: hadoop
      version: 3.4.3

  hadoop_build:
    name: Build hadoop 3.4.3
    needs: hadoop_repo_check
    if: ${{ always() && needs.hadoop_repo_check.result == 'success' && needs.hadoop_repo_check.outputs.already_current != 'true' }}
    uses: ./.github/workflows/build-one-component.yml
    with:
      component: hadoop
      version: 3.4.3
      task: hadoop-rpm

  hadoop_test:
    name: Test hadoop 3.4.3
    needs: hadoop_build
    if: ${{ always() && needs.hadoop_build.result == 'success' }}
    uses: ./.github/workflows/test-components.yml
    with:
      component: hadoop
      version: 3.4.3
      build_run_id: ${{ format('{0}', github.run_id) }}

  hadoop_release:
    name: Release hadoop 3.4.3
    needs: hadoop_test
    if: ${{ always() && needs.hadoop_test.result == 'success' && github.event_name != 'pull_request' }}
    permissions:
      contents: write
      actions: read
      pull-requests: write
    uses: ./.github/workflows/release-components.yml
    with:
      component: hadoop
      version: 3.4.3
      test_run_id: ${{ format('{0}', github.run_id) }}

  hadoop_gate:
    name: Complete hadoop 3.4.3 stage
    needs: [zookeeper_gate, hadoop_repo_check, hadoop_build, hadoop_test, hadoop_release]
    if: >-
      always() &&
      (github.event_name != 'workflow_dispatch' ||
       (inputs.promote_test_run_id == '' &&
        (inputs.start_component == 'hadoop' ||
         (needs.zookeeper_gate.result == 'success' && needs.zookeeper_gate.outputs.continue_chain == 'true'))))
    outputs:
      continue_chain: ${{ steps.gate.outputs.continue_chain }}
    runs-on: ubuntu-latest
    steps:
      - name: Accept verified existing RPMs or a completed release
        id: gate
        env:
          CHECK_RESULT: ${{ needs.hadoop_repo_check.result }}
          ALREADY_CURRENT: ${{ needs.hadoop_repo_check.outputs.already_current }}
          BUILD_RESULT: ${{ needs.hadoop_build.result }}
          TEST_RESULT: ${{ needs.hadoop_test.result }}
          RELEASE_RESULT: ${{ needs.hadoop_release.result }}
          EVENT_NAME: ${{ github.event_name }}
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [[ "${CHECK_RESULT}" == success && "${ALREADY_CURRENT}" == true && "${BUILD_RESULT}" == skipped && "${TEST_RESULT}" == skipped && "${RELEASE_RESULT}" == skipped ]]; then
            echo 'continue_chain=true' >> "${GITHUB_OUTPUT}"
          elif [[ "${CHECK_RESULT}" == success && "${BUILD_RESULT}" == success && "${TEST_RESULT}" == success && ( "${RELEASE_RESULT}" == success || ( "${EVENT_NAME}" == pull_request && "${RELEASE_RESULT}" == skipped ) ) ]]; then
            echo 'continue_chain=true' >> "${GITHUB_OUTPUT}"
          elif [[ "${EVENT_NAME}" == pull_request && "${IS_FORK_PR}" == true && "${BUILD_RESULT}" == skipped && "${TEST_RESULT}" == skipped && "${RELEASE_RESULT}" == skipped ]]; then
            echo 'continue_chain=false' >> "${GITHUB_OUTPUT}"
            echo 'Build is intentionally unavailable to fork PRs.'
          else
            echo "Hadoop stage did not pass: check=${CHECK_RESULT}, repo=${ALREADY_CURRENT}, build=${BUILD_RESULT}, test=${TEST_RESULT}, release=${RELEASE_RESULT}" >&2
            exit 1
          fi

  tez_repo_check:
    name: Check tez 0.10.5 RPM repository
    if: >-
      always() &&
      (github.event_name != 'workflow_dispatch' || inputs.promote_test_run_id == '') &&
      ((github.event_name == 'workflow_dispatch' && inputs.start_component == 'tez') ||
       (needs.hadoop_gate.result == 'success' && needs.hadoop_gate.outputs.continue_chain == 'true'))
    needs: hadoop_gate
    uses: ./.github/workflows/check-component-repo.yml
    with:
      component: tez
      version: 0.10.5

  tez_build:
    name: Build tez 0.10.5
    needs: tez_repo_check
    if: ${{ always() && needs.tez_repo_check.result == 'success' && needs.tez_repo_check.outputs.already_current != 'true' }}
    uses: ./.github/workflows/build-one-component.yml
    with:
      component: tez
      version: 0.10.5
      task: tez-rpm

  tez_test:
    name: Test tez 0.10.5
    needs: tez_build
    if: ${{ always() && needs.tez_build.result == 'success' }}
    uses: ./.github/workflows/test-components.yml
    with:
      component: tez
      version: 0.10.5
      build_run_id: ${{ format('{0}', github.run_id) }}

  tez_release:
    name: Release tez 0.10.5
    needs: tez_test
    if: ${{ always() && needs.tez_test.result == 'success' && github.event_name != 'pull_request' }}
    permissions:
      contents: write
      actions: read
      pull-requests: write
    uses: ./.github/workflows/release-components.yml
    with:
      component: tez
      version: 0.10.5
      test_run_id: ${{ format('{0}', github.run_id) }}

  tez_gate:
    name: Complete tez 0.10.5 stage
    needs: [hadoop_gate, tez_repo_check, tez_build, tez_test, tez_release]
    if: >-
      always() &&
      (github.event_name != 'workflow_dispatch' ||
       (inputs.promote_test_run_id == '' &&
        (inputs.start_component == 'tez' ||
         (needs.hadoop_gate.result == 'success' && needs.hadoop_gate.outputs.continue_chain == 'true'))))
    outputs:
      continue_chain: ${{ steps.gate.outputs.continue_chain }}
    runs-on: ubuntu-latest
    steps:
      - name: Accept verified existing RPMs or a completed release
        id: gate
        env:
          CHECK_RESULT: ${{ needs.tez_repo_check.result }}
          ALREADY_CURRENT: ${{ needs.tez_repo_check.outputs.already_current }}
          BUILD_RESULT: ${{ needs.tez_build.result }}
          TEST_RESULT: ${{ needs.tez_test.result }}
          RELEASE_RESULT: ${{ needs.tez_release.result }}
          EVENT_NAME: ${{ github.event_name }}
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [[ "${CHECK_RESULT}" == success && "${ALREADY_CURRENT}" == true && "${BUILD_RESULT}" == skipped && "${TEST_RESULT}" == skipped && "${RELEASE_RESULT}" == skipped ]]; then
            echo 'continue_chain=true' >> "${GITHUB_OUTPUT}"
          elif [[ "${CHECK_RESULT}" == success && "${BUILD_RESULT}" == success && "${TEST_RESULT}" == success && ( "${RELEASE_RESULT}" == success || ( "${EVENT_NAME}" == pull_request && "${RELEASE_RESULT}" == skipped ) ) ]]; then
            echo 'continue_chain=true' >> "${GITHUB_OUTPUT}"
          elif [[ "${EVENT_NAME}" == pull_request && "${IS_FORK_PR}" == true && "${BUILD_RESULT}" == skipped && "${TEST_RESULT}" == skipped && "${RELEASE_RESULT}" == skipped ]]; then
            echo 'continue_chain=false' >> "${GITHUB_OUTPUT}"
            echo 'Build is intentionally unavailable to fork PRs.'
          else
            echo "Tez stage did not pass: check=${CHECK_RESULT}, repo=${ALREADY_CURRENT}, build=${BUILD_RESULT}, test=${TEST_RESULT}, release=${RELEASE_RESULT}" >&2
            exit 1
          fi

  hive_repo_check:
    name: Check hive 4.0.1 RPM repository
    needs: tez_gate
    if: >-
      always() &&
      (github.event_name != 'workflow_dispatch' || inputs.promote_test_run_id == '') &&
      ((github.event_name == 'workflow_dispatch' && inputs.start_component == 'hive') ||
       (needs.tez_gate.result == 'success' && needs.tez_gate.outputs.continue_chain == 'true'))
    uses: ./.github/workflows/check-component-repo.yml
    with:
      component: hive
      version: 4.0.1

  hive_build:
    name: Build hive 4.0.1
    needs: hive_repo_check
    if: >-
      always() &&
      needs.hive_repo_check.result == 'success' &&
      needs.hive_repo_check.outputs.already_current != 'true'
    uses: ./.github/workflows/build-one-component.yml
    with:
      component: hive
      version: 4.0.1
      task: hive-rpm

  hive_test:
    name: Test hive 4.0.1
    needs: hive_build
    if: ${{ always() && needs.hive_build.result == 'success' }}
    uses: ./.github/workflows/test-components.yml
    with:
      component: hive
      version: 4.0.1
      build_run_id: ${{ format('{0}', github.run_id) }}

  hive_release:
    name: Release hive 4.0.1
    needs: hive_test
    if: ${{ always() && needs.hive_test.result == 'success' && github.event_name != 'pull_request' }}
    permissions:
      contents: write
      actions: read
      pull-requests: write
    uses: ./.github/workflows/release-components.yml
    with:
      component: hive
      version: 4.0.1
      test_run_id: ${{ format('{0}', github.run_id) }}

  hive_gate:
    name: Complete hive 4.0.1 stage
    needs: [tez_gate, hive_repo_check, hive_build, hive_test, hive_release]
    if: >-
      always() &&
      (github.event_name != 'workflow_dispatch' ||
       (inputs.promote_test_run_id == '' &&
        (inputs.start_component == 'hive' ||
         (needs.tez_gate.result == 'success' && needs.tez_gate.outputs.continue_chain == 'true'))))
    outputs:
      continue_chain: ${{ steps.gate.outputs.continue_chain }}
    runs-on: ubuntu-latest
    steps:
      - name: Accept verified existing RPMs or a completed release
        id: gate
        env:
          CHECK_RESULT: ${{ needs.hive_repo_check.result }}
          ALREADY_CURRENT: ${{ needs.hive_repo_check.outputs.already_current }}
          BUILD_RESULT: ${{ needs.hive_build.result }}
          TEST_RESULT: ${{ needs.hive_test.result }}
          RELEASE_RESULT: ${{ needs.hive_release.result }}
          EVENT_NAME: ${{ github.event_name }}
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [[ "${CHECK_RESULT}" == success && "${ALREADY_CURRENT}" == true && "${BUILD_RESULT}" == skipped && "${TEST_RESULT}" == skipped && "${RELEASE_RESULT}" == skipped ]]; then
            echo 'continue_chain=true' >> "${GITHUB_OUTPUT}"
          elif [[ "${CHECK_RESULT}" == success && "${BUILD_RESULT}" == success && "${TEST_RESULT}" == success && ( "${RELEASE_RESULT}" == success || ( "${EVENT_NAME}" == pull_request && "${RELEASE_RESULT}" == skipped ) ) ]]; then
            echo 'continue_chain=true' >> "${GITHUB_OUTPUT}"
          elif [[ "${EVENT_NAME}" == pull_request && "${IS_FORK_PR}" == true && "${BUILD_RESULT}" == skipped && "${TEST_RESULT}" == skipped && "${RELEASE_RESULT}" == skipped ]]; then
            echo 'continue_chain=false' >> "${GITHUB_OUTPUT}"
            echo 'Build is intentionally unavailable to fork PRs.'
          else
            echo "Hive stage did not pass: check=${CHECK_RESULT}, repo=${ALREADY_CURRENT}, build=${BUILD_RESULT}, test=${TEST_RESULT}, release=${RELEASE_RESULT}" >&2
            exit 1
          fi

  spark_repo_check:
    name: Check spark 3.5.8 RPM repository
    needs: hive_gate
    if: >-
      always() &&
      (github.event_name != 'workflow_dispatch' || inputs.promote_test_run_id == '') &&
      ((github.event_name == 'workflow_dispatch' && inputs.start_component == 'spark') ||
       (needs.hive_gate.result == 'success' && needs.hive_gate.outputs.continue_chain == 'true'))
    uses: ./.github/workflows/check-component-repo.yml
    with:
      component: spark
      version: 3.5.8

  spark_build:
    name: Build spark 3.5.8
    needs: spark_repo_check
    if: >-
      always() && needs.spark_repo_check.result == 'success' &&
      needs.spark_repo_check.outputs.already_current != 'true'
    uses: ./.github/workflows/build-one-component.yml
    with:
      component: spark
      version: 3.5.8
      task: spark-rpm

  spark_test:
    name: Test spark 3.5.8
    needs: spark_build
    if: ${{ always() && needs.spark_build.result == 'success' }}
    uses: ./.github/workflows/test-components.yml
    with:
      component: spark
      version: 3.5.8
      build_run_id: ${{ format('{0}', github.run_id) }}

  spark_release:
    name: Release spark 3.5.8
    needs: spark_test
    if: ${{ always() && needs.spark_test.result == 'success' && github.event_name != 'pull_request' }}
    permissions:
      contents: write
      actions: read
      pull-requests: write
    uses: ./.github/workflows/release-components.yml
    with:
      component: spark
      version: 3.5.8
      test_run_id: ${{ format('{0}', github.run_id) }}

  spark_gate:
    name: Complete spark 3.5.8 stage
    needs: [hive_gate, spark_repo_check, spark_build, spark_test, spark_release]
    if: >-
      always() &&
      (github.event_name != 'workflow_dispatch' ||
       (inputs.promote_test_run_id == '' &&
        (inputs.start_component == 'spark' ||
         (needs.hive_gate.result == 'success' && needs.hive_gate.outputs.continue_chain == 'true'))))
    outputs:
      continue_chain: ${{ steps.gate.outputs.continue_chain }}
    runs-on: ubuntu-latest
    steps:
      - name: Accept verified existing RPMs or a completed release
        id: gate
        env:
          CHECK_RESULT: ${{ needs.spark_repo_check.result }}
          ALREADY_CURRENT: ${{ needs.spark_repo_check.outputs.already_current }}
          BUILD_RESULT: ${{ needs.spark_build.result }}
          TEST_RESULT: ${{ needs.spark_test.result }}
          RELEASE_RESULT: ${{ needs.spark_release.result }}
          EVENT_NAME: ${{ github.event_name }}
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [[ "${CHECK_RESULT}" == success && "${ALREADY_CURRENT}" == true && "${BUILD_RESULT}" == skipped && "${TEST_RESULT}" == skipped && "${RELEASE_RESULT}" == skipped ]]; then
            echo 'continue_chain=true' >> "${GITHUB_OUTPUT}"
          elif [[ "${CHECK_RESULT}" == success && "${BUILD_RESULT}" == success && "${TEST_RESULT}" == success && ( "${RELEASE_RESULT}" == success || ( "${EVENT_NAME}" == pull_request && "${RELEASE_RESULT}" == skipped ) ) ]]; then
            echo 'continue_chain=true' >> "${GITHUB_OUTPUT}"
          elif [[ "${EVENT_NAME}" == pull_request && "${IS_FORK_PR}" == true && "${BUILD_RESULT}" == skipped && "${TEST_RESULT}" == skipped && "${RELEASE_RESULT}" == skipped ]]; then
            echo 'continue_chain=false' >> "${GITHUB_OUTPUT}"
            echo 'Build is intentionally unavailable to fork PRs.'
          else
            echo "Spark stage did not pass: check=${CHECK_RESULT}, repo=${ALREADY_CURRENT}, build=${BUILD_RESULT}, test=${TEST_RESULT}, release=${RELEASE_RESULT}" >&2
            exit 1
          fi

  hbase_repo_check:
    name: Check hbase 2.6.5 RPM repository
    needs: spark_gate
    if: >-
      always() &&
      (github.event_name != 'workflow_dispatch' || inputs.promote_test_run_id == '') &&
      ((github.event_name == 'workflow_dispatch' && inputs.start_component == 'hbase') ||
       (needs.spark_gate.result == 'success' && needs.spark_gate.outputs.continue_chain == 'true'))
    uses: ./.github/workflows/check-component-repo.yml
    with:
      component: hbase
      version: 2.6.5

  hbase_build:
    name: Build hbase 2.6.5
    needs: hbase_repo_check
    if: >-
      always() && needs.hbase_repo_check.result == 'success' &&
      needs.hbase_repo_check.outputs.already_current != 'true'
    uses: ./.github/workflows/build-one-component.yml
    with:
      component: hbase
      version: 2.6.5
      task: hbase-rpm

  hbase_test:
    name: Test hbase 2.6.5
    needs: hbase_build
    if: ${{ always() && needs.hbase_build.result == 'success' }}
    uses: ./.github/workflows/test-components.yml
    with:
      component: hbase
      version: 2.6.5
      build_run_id: ${{ format('{0}', github.run_id) }}

  hbase_release:
    name: Release hbase 2.6.5
    needs: hbase_test
    if: ${{ always() && needs.hbase_test.result == 'success' && github.event_name != 'pull_request' }}
    permissions:
      contents: write
      actions: read
      pull-requests: write
    uses: ./.github/workflows/release-components.yml
    with:
      component: hbase
      version: 2.6.5
      test_run_id: ${{ format('{0}', github.run_id) }}

  hbase_gate:
    name: Complete hbase 2.6.5 stage
    needs: [spark_gate, hbase_repo_check, hbase_build, hbase_test, hbase_release]
    if: >-
      always() &&
      (github.event_name != 'workflow_dispatch' ||
       (inputs.promote_test_run_id == '' &&
        (inputs.start_component == 'hbase' ||
         (needs.spark_gate.result == 'success' && needs.spark_gate.outputs.continue_chain == 'true'))))
    runs-on: ubuntu-latest
    steps:
      - name: Accept verified existing RPMs or a completed release
        env:
          CHECK_RESULT: ${{ needs.hbase_repo_check.result }}
          ALREADY_CURRENT: ${{ needs.hbase_repo_check.outputs.already_current }}
          BUILD_RESULT: ${{ needs.hbase_build.result }}
          TEST_RESULT: ${{ needs.hbase_test.result }}
          RELEASE_RESULT: ${{ needs.hbase_release.result }}
          EVENT_NAME: ${{ github.event_name }}
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [[ "${CHECK_RESULT}" == success && "${ALREADY_CURRENT}" == true && "${BUILD_RESULT}" == skipped && "${TEST_RESULT}" == skipped && "${RELEASE_RESULT}" == skipped ]]; then
            echo 'continue_chain=true' >> "${GITHUB_OUTPUT}"
          elif [[ "${CHECK_RESULT}" == success && "${BUILD_RESULT}" == success && "${TEST_RESULT}" == success && ( "${RELEASE_RESULT}" == success || ( "${EVENT_NAME}" == pull_request && "${RELEASE_RESULT}" == skipped ) ) ]]; then
            echo 'continue_chain=true' >> "${GITHUB_OUTPUT}"
          elif [[ "${EVENT_NAME}" == pull_request && "${IS_FORK_PR}" == true && "${BUILD_RESULT}" == skipped && "${TEST_RESULT}" == skipped && "${RELEASE_RESULT}" == skipped ]]; then
            echo 'Build is intentionally unavailable to fork PRs.'
          else
            echo "HBase stage did not pass: check=${CHECK_RESULT}, repo=${ALREADY_CURRENT}, build=${BUILD_RESULT}, test=${TEST_RESULT}, release=${RELEASE_RESULT}" >&2
            exit 1
          fi

  kafka_prerequisite:
    name: Verify ZooKeeper RPM prerequisite for Kafka
    if: github.event_name == 'workflow_dispatch' && inputs.start_component == 'kafka'
    uses: ./.github/workflows/component-lifecycle.yml
    with:
      component: zookeeper
      version: '3.8.4'
      builder: bigtop
      artifact_type: service-rpm
      build_task: zookeeper-rpm
      test_profile: legacy-smoke
      jdk: '8'
      jdk_package: java-1.8.0-openjdk-devel
      source_identity: ''

  kafka:
    name: Kafka 3.4.1 Build Test Release
    needs: [zookeeper_gate, kafka_prerequisite]
    if: >-
      always() &&
      ((github.event_name == 'workflow_dispatch' && inputs.start_component == 'kafka' &&
        needs.kafka_prerequisite.result == 'success' &&
        needs.kafka_prerequisite.outputs.stage_passed == 'true') ||
       ((github.event_name != 'workflow_dispatch' || inputs.start_component == 'all') &&
        needs.zookeeper_gate.result == 'success' &&
        needs.zookeeper_gate.outputs.continue_chain == 'true'))
    uses: ./.github/workflows/component-lifecycle.yml
    with:
      component: kafka
      version: '3.4.1'
      builder: bigtop
      artifact_type: service-rpm
      build_task: kafka-rpm
      test_profile: kafka-kraft-smoke
      jdk: '8'
      jdk_package: java-1.8.0-openjdk-devel
      source_identity: 19670ce6a3cc68833b7dd47697cd6272b66bb372

  flink_prerequisite:
    name: Verify Hadoop RPM prerequisite for Flink
    if: github.event_name == 'workflow_dispatch' && inputs.start_component == 'flink'
    uses: ./.github/workflows/component-lifecycle.yml
    with:
      component: hadoop
      version: '3.4.3'
      builder: bigtop
      artifact_type: service-rpm
      build_task: hadoop-rpm
      test_profile: legacy-smoke
      jdk: '8'
      jdk_package: java-1.8.0-openjdk-devel
      source_identity: ''

  flink:
    name: Flink 1.20.1 Build Test Release
    needs: [hadoop_gate, flink_prerequisite]
    if: >-
      always() &&
      ((github.event_name == 'workflow_dispatch' && inputs.start_component == 'flink' &&
        needs.flink_prerequisite.result == 'success' &&
        needs.flink_prerequisite.outputs.stage_passed == 'true') ||
       ((github.event_name != 'workflow_dispatch' || inputs.start_component == 'all') &&
        needs.hadoop_gate.result == 'success' &&
        needs.hadoop_gate.outputs.continue_chain == 'true'))
    uses: ./.github/workflows/component-lifecycle.yml
    with:
      component: flink
      version: '1.20.1'
      builder: bigtop
      artifact_type: service-rpm
      build_task: flink-rpm
      test_profile: flink-local-job-smoke
      jdk: '11'
      jdk_package: java-11-openjdk-devel
      source_identity: 19670ce6a3cc68833b7dd47697cd6272b66bb372
