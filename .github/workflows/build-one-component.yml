name: Build One Component

on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
      version:
        required: true
        type: string
      task:
        required: true
        type: string
      builder:
        required: false
        type: string
        default: bigtop
      artifact_type:
        required: false
        type: string
        default: service-rpm
      test_profile:
        required: false
        type: string
        default: legacy-smoke
      jdk:
        required: false
        type: string
        default: '8'
      jdk_package:
        required: false
        type: string
        default: java-1.8.0-openjdk-devel
      source_identity:
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build ${{ inputs.component }} ${{ inputs.version }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 240

    env:
      OPENEULER_IMAGE: openeuler/openeuler:22.03-lts-sp4
      WORK_ROOT: /tmp/bigdata-component-build
      MAVEN_MIRROR_URL: ${{ vars.MAVEN_MIRROR_URL }}
      MAVEN_NETWORK_MODE: ${{ vars.MAVEN_NETWORK_MODE || 'online' }}

    steps:
      - uses: actions/checkout@v4

      - name: Reuse compiled Hue runtime for RPM revision
        if: inputs.component == 'hue'
        uses: actions/download-artifact@v4
        with:
          name: hue-4.11.0-bigtop-3.6-openeuler22-rpm
          path: .hue-base-artifact
          run-id: 38904003747
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Runner capacity
        run: |
          df -h
          free -h
          docker version

      - name: Resolve runtime package contract
        id: catalog
        shell: bash
        env:
          COMPONENT: ${{ inputs.component }}
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pyyaml
          python3 scripts/ci/resolve-component-dependencies.py \
            --config ci/components.yaml \
            --component "${COMPONENT}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Resolve component build adapter
        id: adapter
        env:
          COMPONENT: ${{ inputs.component }}
          BUILD_TASK: ${{ inputs.task }}
          BUILDER: ${{ inputs.builder }}
          TEST_PROFILE: ${{ inputs.test_profile }}
        run: |
          python3 scripts/ci/resolve-component-adapter.py \
            --builder "${BUILDER}" \
            --component "${COMPONENT}" \
            --operation build \
            --task "${BUILD_TASK}" \
            --test-profile "${TEST_PROFILE}" \
            --scripts-dir scripts/ci \
            --github-output "${GITHUB_OUTPUT}"

      - name: Restore dependency downloads
        id: dependencies
        uses: ./.github/actions/restore-build-dependencies
        with:
          component: ${{ inputs.component }}
          version: ${{ inputs.version }}
          jdk: ${{ inputs.jdk }}
          source_identity: ${{ inputs.source_identity }}

      - name: Build RPMs
        id: build
        timeout-minutes: 220
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${WORK_ROOT}"
          mkdir -p "${WORK_ROOT}" /tmp/bigdata-component-cache/{m2,gradle}
          docker pull "${OPENEULER_IMAGE}"
          docker run --rm --init \
            -e MAVEN_MIRROR_URL -e MAVEN_NETWORK_MODE \
            -e COMPONENT="${{ inputs.component }}" \
            -e VERSION="${{ inputs.version }}" \
            -e BUILD_TASK="${{ inputs.task }}" \
            -e BIGTOP_REF=branch-3.6 \
            -e BUILDER="${{ inputs.builder }}" \
            -e ARTIFACT_TYPE="${{ inputs.artifact_type }}" \
            -e TEST_PROFILE="${{ inputs.test_profile }}" \
            -e COMPONENT_JDK="${{ inputs.jdk }}" \
            -e COMPONENT_JDK_PACKAGE="${{ inputs.jdk_package }}" \
            -e EXPECTED_SOURCE_IDENTITY="${{ inputs.source_identity }}" \
            -e COMPONENT_COMPATIBILITY_IDENTITY="${{ steps.catalog.outputs.compatibility_identity }}" \
            -e JDK_RUNTIME_ARCHIVE_URL="${{ steps.catalog.outputs.jdk_runtime_archive_url }}" \
            -e JDK_RUNTIME_ARCHIVE_SHA256="${{ steps.catalog.outputs.jdk_runtime_archive_sha256 }}" \
            -e COMPONENT_RUNTIME_PACKAGES="${{ steps.catalog.outputs.packages }}" \
            -e BUILD_RUN_ID="${GITHUB_RUN_ID}" \
            -e WORK_ROOT=/work \
            -v "${GITHUB_WORKSPACE}:/workspace:ro" \
            -v "${WORK_ROOT}:/work" \
            -v /tmp/bigdata-component-cache/m2:/root/.m2 \
            -v /tmp/bigdata-component-cache/gradle:/root/.gradle \
            "${OPENEULER_IMAGE}" \
            bash "/workspace/scripts/ci/${{ steps.adapter.outputs.script }}"

      - name: Save newly downloaded dependencies
        if: ${{ always() && steps.dependencies.outcome == 'success' && (steps.build.outcome == 'success' || steps.build.outcome == 'failure') }}
        uses: ./.github/actions/save-build-dependencies
        with:
          key: ${{ steps.dependencies.outputs.key }}

      - name: Record dependency cache observation
        if: always()
        env:
          RESTORE_OUTCOME: ${{ steps.dependencies.outcome }}
          MATCHED_CACHE_KEY: ${{ steps.dependencies.outputs.matched_key }}
        run: |
          sudo mkdir -p "${WORK_ROOT}/artifacts/evidence"
          sudo chown "$(id -u):$(id -g)" "${WORK_ROOT}/artifacts/evidence"
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          outcome = os.environ['RESTORE_OUTCOME']
          data = {'schema': 'bigdata.dependency-cache-observation/v1',
                  'restore_outcome': outcome,
                  'restored': bool(os.environ['MATCHED_CACHE_KEY']) if outcome == 'success' else None,
                  'matched_key': os.environ['MATCHED_CACHE_KEY'] or None}
          (Path(os.environ['WORK_ROOT']) / 'artifacts/evidence/dependency-cache.json').write_text(json.dumps(data, indent=2)+'\n')
          PYCODE

      - name: Publish summary
        if: always()
        run: |
          test ! -f "${WORK_ROOT}/artifacts/evidence/evidence.md" ||             cat "${WORK_ROOT}/artifacts/evidence/evidence.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload RPM artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.component }}-${{ inputs.version }}-bigtop-3.6-openeuler22-rpm
          path: /tmp/bigdata-component-build/artifacts
          if-no-files-found: error
          retention-days: 14
