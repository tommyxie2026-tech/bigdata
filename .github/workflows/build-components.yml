name: Build Components

on:
  workflow_dispatch:
    inputs:
      start_component:
        description: First component to build, test, and package as a release candidate
        required: true
        default: tez
        type: choice
        options:
          - tez
          - hive
          - spark
          - hbase
  push:
    branches:
      - main
    paths:
      - ".github/workflows/*components.yml"
      - ".github/workflows/build-one-component.yml"
      - "scripts/ci/*.sh"
      - "ci/components.yaml"

  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/*components.yml"
      - ".github/workflows/build-one-component.yml"
      - "scripts/ci/*.sh"
      - "ci/components.yaml"

permissions:
  contents: read
  actions: read

jobs:
  tez_build:
    name: Build tez 0.10.5
    if: github.event_name != 'workflow_dispatch' || inputs.start_component == 'tez'
    uses: ./.github/workflows/build-one-component.yml
    with:
      component: tez
      version: 0.10.5
      task: tez-rpm

  tez_test:
    name: Test tez 0.10.5
    needs: tez_build
    uses: ./.github/workflows/test-components.yml
    with:
      component: tez
      version: 0.10.5
      build_run_id: ${{ format('{0}', github.run_id) }}

  tez_release:
    name: Release tez 0.10.5
    needs: tez_test
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release-components.yml
    with:
      component: tez
      version: 0.10.5
      test_run_id: ${{ format('{0}', github.run_id) }}

  hive_build:
    name: Build hive 4.0.1
    needs: tez_release
    if: >-
      always() &&
      ((github.event_name == 'workflow_dispatch' && inputs.start_component == 'hive') ||
       needs.tez_release.result == 'success')
    uses: ./.github/workflows/build-one-component.yml
    with:
      component: hive
      version: 4.0.1
      task: hive-rpm

  hive_test:
    name: Test hive 4.0.1
    needs: hive_build
    uses: ./.github/workflows/test-components.yml
    with:
      component: hive
      version: 4.0.1
      build_run_id: ${{ format('{0}', github.run_id) }}

  hive_release:
    name: Release hive 4.0.1
    needs: hive_test
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release-components.yml
    with:
      component: hive
      version: 4.0.1
      test_run_id: ${{ format('{0}', github.run_id) }}

  spark_build:
    name: Build spark 3.5.8
    needs: hive_release
    if: >-
      always() &&
      ((github.event_name == 'workflow_dispatch' && inputs.start_component == 'spark') ||
       needs.hive_release.result == 'success')
    uses: ./.github/workflows/build-one-component.yml
    with:
      component: spark
      version: 3.5.8
      task: spark-rpm

  spark_test:
    name: Test spark 3.5.8
    needs: spark_build
    uses: ./.github/workflows/test-components.yml
    with:
      component: spark
      version: 3.5.8
      build_run_id: ${{ format('{0}', github.run_id) }}

  spark_release:
    name: Release spark 3.5.8
    needs: spark_test
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release-components.yml
    with:
      component: spark
      version: 3.5.8
      test_run_id: ${{ format('{0}', github.run_id) }}

  hbase_build:
    name: Build hbase 2.6.5
    needs: spark_release
    if: >-
      always() &&
      ((github.event_name == 'workflow_dispatch' && inputs.start_component == 'hbase') ||
       needs.spark_release.result == 'success')
    uses: ./.github/workflows/build-one-component.yml
    with:
      component: hbase
      version: 2.6.5
      task: hbase-rpm

  hbase_test:
    name: Test hbase 2.6.5
    needs: hbase_build
    uses: ./.github/workflows/test-components.yml
    with:
      component: hbase
      version: 2.6.5
      build_run_id: ${{ format('{0}', github.run_id) }}

  hbase_release:
    name: Release hbase 2.6.5
    needs: hbase_test
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release-components.yml
    with:
      component: hbase
      version: 2.6.5
      test_run_id: ${{ format('{0}', github.run_id) }}
