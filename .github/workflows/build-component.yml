name: Build Component

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/build-component.yml"
      - "scripts/ci/build-zookeeper-rpm-openeuler-container.sh"
      - "packaging/bigtop/**"
      - "docs/version-matrix.md"

permissions:
  contents: read

concurrency:
  group: build-component-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-zookeeper:
    name: ZooKeeper RPM on openEuler container
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      BIGTOP_REF: branch-3.6
      COMPONENT: zookeeper
      WORK_ROOT: /tmp/bigdata-bigtop-build
      OPENEULER_IMAGE: openeuler/openeuler:22.03-lts-sp4

    steps:
      - name: Checkout BIGDATA
        uses: actions/checkout@v4

      - name: Runner capacity
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          docker version
          df -h
          free -h

      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${WORK_ROOT}"
          mkdir -p "${WORK_ROOT}"

      - name: Pull openEuler build image
        shell: bash
        run: |
          set -euo pipefail
          docker pull "${OPENEULER_IMAGE}"
          docker image inspect "${OPENEULER_IMAGE}" \
            --format 'image={{.RepoTags}} digest={{.RepoDigests}}'

      - name: Build ZooKeeper RPM in openEuler
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --name bigdata-bigtop-zookeeper-build \
            -e BIGTOP_REF="${BIGTOP_REF}" \
            -e COMPONENT="${COMPONENT}" \
            -e WORK_ROOT=/work \
            -v "${GITHUB_WORKSPACE}:/workspace:ro" \
            -v "${WORK_ROOT}:/work" \
            "${OPENEULER_IMAGE}" \
            bash /workspace/scripts/ci/build-zookeeper-rpm-openeuler-container.sh

      - name: Validate host-side artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find "${WORK_ROOT}" -maxdepth 4 -type f -print 2>/dev/null | sort || true

          if [[ -d "${WORK_ROOT}/artifacts/rpms" ]]; then
            rpm_count=$(find "${WORK_ROOT}/artifacts/rpms" -type f -name '*.rpm' | wc -l)
          else
            rpm_count=0
          fi

          echo "rpm_count=${rpm_count}" >> "${GITHUB_STEP_SUMMARY}"

          if [[ -f "${WORK_ROOT}/artifacts/evidence/evidence.md" ]]; then
            cat "${WORK_ROOT}/artifacts/evidence/evidence.md" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zookeeper-3.8.4-bigtop-3.6-openeuler22-rpm
          path: /tmp/bigdata-bigtop-build/artifacts
          if-no-files-found: error
          retention-days: 14


  package-install:
    name: ZooKeeper RPM repo and DNF install
    needs: build-zookeeper
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      OPENEULER_IMAGE: openeuler/openeuler:22.03-lts-sp4
      ARTIFACT_ROOT: /tmp/bigdata-zookeeper-artifact
      INSTALL_ROOT: /tmp/bigdata-zookeeper-install

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: zookeeper-3.8.4-bigtop-3.6-openeuler22-rpm
          path: /tmp/bigdata-zookeeper-artifact

      - name: Inspect artifact
        shell: bash
        run: |
          set -euo pipefail
          find "${ARTIFACT_ROOT}" -maxdepth 4 -type f -print | sort
          test -d "${ARTIFACT_ROOT}/rpms"
          test "$(find "${ARTIFACT_ROOT}/rpms" -type f -name '*.rpm' | wc -l)" -gt 0

      - name: Create repository and install RPMs in clean openEuler
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${INSTALL_ROOT}"
          mkdir -p "${INSTALL_ROOT}"

          docker pull "${OPENEULER_IMAGE}"

          docker run --rm \
            --name bigdata-zookeeper-install-test \
            -v "${ARTIFACT_ROOT}:/artifact:ro" \
            -v "${INSTALL_ROOT}:/evidence" \
            "${OPENEULER_IMAGE}" \
            bash -lc '
              set -euo pipefail

              dnf -y install createrepo_c dnf-utils rpm findutils

              mkdir -p /tmp/bigdata-repo
              cp /artifact/rpms/*.rpm /tmp/bigdata-repo/
              createrepo_c /tmp/bigdata-repo

              cat > /etc/yum.repos.d/bigdata-ci.repo <<EOF
          [bigdata-ci]
          name=BIGDATA CI Local Repository
          baseurl=file:///tmp/bigdata-repo
          enabled=1
          gpgcheck=0
          metadata_expire=0
          EOF

              {
                echo "== RPM files =="
                ls -lh /tmp/bigdata-repo/*.rpm
                echo
                echo "== Repository =="
                dnf repolist
                echo
                echo "== RPM metadata =="
                for rpm_file in /tmp/bigdata-repo/*.rpm; do
                  rpm -qpi "${rpm_file}"
                done
                echo
                echo "== Install =="
                dnf -y install /tmp/bigdata-repo/*.rpm
                echo
                echo "== Installed packages =="
                rpm -qa | grep -i zookeeper || true
              } 2>&1 | tee /evidence/dnf-install.log

              rpm -qa | grep -i zookeeper > /evidence/installed-packages.txt

              cat > /evidence/evidence.md <<EOF
          # CI Evidence — ZooKeeper RPM Repository and Install

          schema: bigdata.evidence/v1
          stage: package-install
          component: zookeeper
          version: 3.8.4
          environment: openEuler-22.03-LTS-SP4-clean-container
          repository: local-createrepo-c
          package_manager: dnf
          status: PASS
          EOF
            '

      - name: Publish install evidence to summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "${INSTALL_ROOT}/evidence.md" ]]; then
            cat "${INSTALL_ROOT}/evidence.md" >> "${GITHUB_STEP_SUMMARY}"
          fi
          if [[ -f "${INSTALL_ROOT}/installed-packages.txt" ]]; then
            echo "## Installed packages" >> "${GITHUB_STEP_SUMMARY}"
            cat "${INSTALL_ROOT}/installed-packages.txt" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload install evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zookeeper-3.8.4-bigtop-3.6-openeuler22-install-evidence
          path: /tmp/bigdata-zookeeper-install
          if-no-files-found: error
          retention-days: 14
