services:
  maven:
    image: dzikoysk/reposilite:3.6.3@sha256:90de4c8e6c0e7e6aef71a4d9e8f3fabb3ac354524e0d0245a8e3fa65bc5832fc
    init: true
    restart: unless-stopped
    environment:
      JAVA_OPTS: '-Xms128m -Xmx512m -Dreposilite.status.remote-version-check=false'
      REPOSILITE_OPTS: '--shared-configuration=/config/reposilite.json'
    volumes:
      - maven-data:/app/data
      - ./reposilite.json:/config/reposilite.json:ro
    networks: [internal, egress]
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', '--connect-timeout', '2', '--max-time', '5', 'http://127.0.0.1:8080/']
      interval: 10s
      timeout: 6s
      retries: 30
  npm:
    image: verdaccio/verdaccio:6.10.6@sha256:4223527d358a17580ab897b174f6d1c585c2b8da8245e3d83866e31f3feb5470
    init: true
    restart: unless-stopped
    environment:
      VERDACCIO_PUBLIC_URL: '${PROXY_PUBLIC_ORIGIN:-https://localhost:8443}/npm'
    volumes:
      - npm-data:/verdaccio/storage
      - ./verdaccio.yaml:/verdaccio/conf/config.yaml:ro
    networks: [internal, egress]
  pypi:
    build:
      context: .
      dockerfile: devpi.Dockerfile
    init: true
    restart: unless-stopped
    volumes:
      - pypi-data:/data
    networks: [internal, egress]
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:3141/+status", timeout=5).read()']
      interval: 10s
      timeout: 6s
      retries: 30
  tls:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    environment:
      PROXY_PUBLIC_ORIGIN: '${PROXY_PUBLIC_ORIGIN:-https://localhost:8443}'
    depends_on:
      maven:
        condition: service_healthy
      pypi:
        condition: service_healthy
      npm:
        condition: service_started
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - '${PROXY_CERT_DIR:?Provide TLS certificate directory}:/certificates:ro'
    ports:
      - '127.0.0.1:8443:8443'
    networks: [internal]
volumes:
  maven-data:
  npm-data:
  pypi-data:
networks:
  internal:
    internal: true
    name: '${COMPOSE_PROJECT_NAME:-dependency-proxy}-internal'
  egress:
    name: '${COMPOSE_PROJECT_NAME:-dependency-proxy}-egress'
