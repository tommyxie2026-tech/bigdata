name: Release Components

on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
      version:
        required: true
        type: string
      test_run_id:
        required: true
        type: string
      artifact_type:
        required: false
        type: string
        default: service-rpm
      test_profile:
        required: false
        type: string
        default: legacy-smoke
      jdk:
        required: false
        type: string
        default: '8'
      jdk_package:
        required: false
        type: string
        default: java-1.8.0-openjdk
      source_identity:
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      component:
        description: Component to release
        required: true
        type: choice
        options:
          - zookeeper
          - hadoop
          - tez
          - hive
          - spark
          - hbase
          - kafka
          - flink
          - trino
          - iceberg
          - hue
      version:
        description: Component version
        required: true
        type: string
      test_run_id:
        description: Successful Test Components run ID
        required: true
        type: string
      artifact_type:
        description: Artifact contract
        required: false
        default: ''
        type: string
      test_profile:
        description: Passing clean-environment test profile
        required: false
        default: ''
        type: string
      jdk:
        description: Component build/test JDK version
        required: false
        default: ''
        type: string
      jdk_package:
        description: Component JDK RPM used by the test
        required: false
        default: ''
        type: string
      source_identity:
        description: Immutable source commit or archive checksum
        required: false
        default: ''
        type: string
      publish_github_release:
        description: Publish GitHub prereleases
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: read
  pull-requests: write

jobs:
  release:
    name: Release ${{ inputs.component }} ${{ inputs.version }}
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    env:
      TEST_RUN_ID: ${{ inputs.test_run_id }}
      ARTIFACT_TYPE: ${{ inputs.artifact_type || '' }}
      TEST_PROFILE: ${{ inputs.test_profile || '' }}
      COMPONENT_JDK: ${{ inputs.jdk || '8' }}
      COMPONENT_JDK_PACKAGE: ${{ inputs.jdk_package }}
      EXPECTED_SOURCE_IDENTITY: ${{ inputs.source_identity || '' }}
      RELEASE_ROOT: /tmp/bigdata-release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Resolve component compatibility identity
        id: catalog
        env:
          COMPONENT: ${{ inputs.component }}
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pyyaml
          python3 scripts/ci/resolve-component-dependencies.py \
            --config ci/components.yaml \
            --component "${COMPONENT}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Download tested RPMs
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.component }}-${{ inputs.version }}-tested-rpms
          path: /tmp/tested-rpms
          run-id: ${{ env.TEST_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download test evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.component }}-${{ inputs.version }}-test-evidence
          path: /tmp/test-evidence
          run-id: ${{ env.TEST_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble release candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${RELEASE_ROOT}"
          mkdir -p "${RELEASE_ROOT}"/{rpms,evidence}

          find /tmp/tested-rpms -type f -name '*.rpm' -exec cp -v {} "${RELEASE_ROOT}/rpms/" \;
          cp -a /tmp/test-evidence/. "${RELEASE_ROOT}/evidence/"

          test_evidence="${RELEASE_ROOT}/evidence/evidence.md"
          require_evidence_field() {
            local key="$1" expected="$2" actual
            if ! grep -Fqx -- "${key}: ${expected}" "${test_evidence}"; then
              actual="$(awk -F ': ' -v key="${key}" '$1 == key { value = substr($0, index($0, ": ") + 2); sub(/\\r$/, "", value); print value; exit }' "${test_evidence}")"
              printf 'Test evidence field mismatch: field=%s expected=%q actual=%q\n' \
                "${key}" "${expected}" "${actual:-<missing>}" >&2
              return 1
            fi
          }
          require_evidence_field status PASS
          require_evidence_field component "${{ inputs.component }}"
          require_evidence_field version "${{ inputs.version }}"
          evidence_artifact_type="$(awk -F ': ' '$1 == "artifact_type" { print $2 }' "${test_evidence}")"
          evidence_test_profile="$(awk -F ': ' '$1 == "test_profile" { print $2 }' "${test_evidence}")"
          evidence_jdk="$(awk -F ': ' '$1 == "toolchain_jdk" { print $2 }' "${test_evidence}")"
          evidence_jdk_package="$(awk -F ': ' '$1 == "jdk_package" { print $2 }' "${test_evidence}")"
          if [[ -n "${TEST_PROFILE}" && "${TEST_PROFILE}" != "${evidence_test_profile}" ]]; then
            printf 'Requested test profile mismatch: requested=%q evidence=%q\n' "${TEST_PROFILE}" "${evidence_test_profile:-<missing>}" >&2
            exit 1
          fi
          evidence_build_run_id="$(awk -F ': ' '$1 == "build_run_id" { print $2 }' "${test_evidence}")"
          evidence_test_run_id="$(awk -F ': ' '$1 == "test_run_id" { print $2 }' "${test_evidence}")"
          evidence_source_identity="$(awk -F ': ' '$1 == "source_identity" { print $2 }' "${test_evidence}")"
          evidence_compatibility_identity="$(awk -F ': ' '$1 == "compatibility_identity" { print $2 }' "${test_evidence}")"
          expected_compatibility_identity="${{ steps.catalog.outputs.compatibility_identity }}"
          if [[ "${evidence_compatibility_identity}" != "${expected_compatibility_identity}" ]]; then
            printf 'Test evidence compatibility identity mismatch: evidence=%s expected=%s\n' \
              "${evidence_compatibility_identity:-<missing>}" "${expected_compatibility_identity}" >&2
            exit 1
          fi
          if [[ "${evidence_test_profile}" != legacy-smoke ]]; then
            require_evidence_field artifact_type "${evidence_artifact_type}"
            require_evidence_field test_profile "${evidence_test_profile}"
            require_evidence_field toolchain_jdk "${evidence_jdk}"
            if [[ -n "${COMPONENT_JDK_PACKAGE}" ]]; then
              if [[ "${evidence_jdk_package}" != "${COMPONENT_JDK_PACKAGE}" ]]; then
                printf 'Test evidence JDK package mismatch: evidence=%q expected=%q\\n' \
                  "${evidence_jdk_package:-<missing>}" "${COMPONENT_JDK_PACKAGE}" >&2
                exit 1
              fi
              require_evidence_field jdk_package "${COMPONENT_JDK_PACKAGE}"
            elif [[ -n "${evidence_jdk_package}" ]]; then
              require_evidence_field jdk_package "${evidence_jdk_package}"
            else
              expected_jdk_archive_sha="${{ steps.catalog.outputs.jdk_runtime_archive_sha256 }}"
              evidence_jdk_archive_sha="$(awk -F ': ' '$1 == "jdk_runtime_archive_sha256" { print $2 }' "${test_evidence}")"
              if [[ -z "${expected_jdk_archive_sha}" || "${evidence_jdk_archive_sha}" != "${expected_jdk_archive_sha}" ]]; then
                printf 'JDK archive checksum mismatch: evidence=%q expected=%q\\n' "${evidence_jdk_archive_sha:-<missing>}" "${expected_jdk_archive_sha:-<missing>}" >&2
                exit 1
              fi
            fi
            require_evidence_field test_run_id "${TEST_RUN_ID}"
            for required_key in artifact_type test_profile toolchain_jdk; do
              required_value="$(awk -F ': ' -v key="${required_key}" '$1 == key { print $2; exit }' "${test_evidence}")"
              if [[ -z "${required_value}" ]]; then
                printf 'Test evidence field is required but empty: field=%s\n' "${required_key}" >&2
                exit 1
              fi
            done
            if [[ "${evidence_test_run_id}" != "${TEST_RUN_ID}" ]]; then
              printf 'Test evidence run ID mismatch: evidence=%q expected=%q\n' "${evidence_test_run_id:-<missing>}" "${TEST_RUN_ID}" >&2
              exit 1
            fi
            if [[ ! "${evidence_build_run_id}" =~ ^[0-9]+$ ]]; then
              printf 'Test evidence build run ID is invalid: actual=%q\n' "${evidence_build_run_id:-<missing>}" >&2
              exit 1
            fi
            if [[ -n "${ARTIFACT_TYPE}" && "${ARTIFACT_TYPE}" != "${evidence_artifact_type}" ]]; then
              printf 'Requested artifact type mismatch: requested=%q evidence=%q\n' "${ARTIFACT_TYPE}" "${evidence_artifact_type:-<missing>}" >&2
              exit 1
            fi
            if [[ -n "${EXPECTED_SOURCE_IDENTITY}" && "${EXPECTED_SOURCE_IDENTITY}" != "${evidence_source_identity}" ]]; then
              printf 'Requested source identity mismatch: requested=%q evidence=%q\n' "${EXPECTED_SOURCE_IDENTITY}" "${evidence_source_identity:-<missing>}" >&2
              exit 1
            fi
          fi
          source_identity="$(awk -F ': ' '$1 == "source_identity" { print $2 }' "${test_evidence}")"
          build_run_id="$(awk -F ': ' '$1 == "build_run_id" { print $2 }' "${test_evidence}")"
          ARTIFACT_TYPE="${evidence_artifact_type:-${ARTIFACT_TYPE:-service-rpm}}"
          TEST_PROFILE="${evidence_test_profile:-${TEST_PROFILE:-legacy-smoke}}"
          COMPONENT_JDK="${evidence_jdk:-${COMPONENT_JDK:-8}}"
          if [[ -n "${evidence_jdk_archive_sha:-}" ]]; then
            COMPONENT_JDK_PACKAGE="${evidence_jdk_package}"
          else
            COMPONENT_JDK_PACKAGE="${evidence_jdk_package:-${COMPONENT_JDK_PACKAGE:-java-1.8.0-openjdk}}"
          fi
          if [[ -n "${EXPECTED_SOURCE_IDENTITY}" && "${source_identity}" != "${EXPECTED_SOURCE_IDENTITY}" ]]; then
            printf 'Test evidence source identity mismatch: evidence=%q expected=%q\n' "${source_identity:-<missing>}" "${EXPECTED_SOURCE_IDENTITY}" >&2
            exit 1
          fi
          if [[ ! "${build_run_id}" =~ ^[0-9]+$ ]]; then
            printf 'Test evidence build run ID is invalid: actual=%q\n' "${build_run_id:-<missing>}" >&2
            exit 1
          fi
          if [[ ! "${TEST_RUN_ID}" =~ ^[0-9]+$ ]]; then
            printf 'Requested test run ID is invalid: actual=%q\n' "${TEST_RUN_ID}" >&2
            exit 1
          fi

          rpm_count=$(find "${RELEASE_ROOT}/rpms" -type f -name '*.rpm' | wc -l)
          if [[ "${rpm_count}" -le 0 ]]; then
            echo 'Release candidate contains no RPM files.' >&2
            exit 1
          fi

          (
            cd "${RELEASE_ROOT}"
            find rpms -type f -name '*.rpm' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )

          cat > "${RELEASE_ROOT}/release-manifest.yaml" <<EOF
          schema: bigdata.release/v2
          component: ${{ inputs.component }}
          component_version: ${{ inputs.version }}
          bigtop_version: 3.6.0
          artifact_type: ${ARTIFACT_TYPE}
          source_identity: ${source_identity}
          compatibility_identity: ${evidence_compatibility_identity}
          test_profile: ${TEST_PROFILE}
          jdk: ${COMPONENT_JDK}
          jdk_package: ${COMPONENT_JDK_PACKAGE}
          jdk_runtime_archive_sha256: ${{ steps.catalog.outputs.jdk_runtime_archive_sha256 }}
          build_run_id: ${build_run_id}
          test_run_id: ${TEST_RUN_ID}
          os: openEuler 22.03 LTS SP4
          package_format: RPM
          rpm_count: ${rpm_count}
          status: RELEASE_CANDIDATE
          EOF

          archive="bigdata-1.0-${{ inputs.component }}-${{ inputs.version }}-rc.tar.gz"
          tar -C "${RELEASE_ROOT}" -czf "/tmp/${archive}" .
          sha256sum "/tmp/${archive}" > "/tmp/${archive}.sha256"

          cat "${RELEASE_ROOT}/release-manifest.yaml" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: bigdata-1.0-${{ inputs.component }}-${{ inputs.version }}-rc
          path: |
            /tmp/bigdata-release
            /tmp/bigdata-1.0-${{ inputs.component }}-${{ inputs.version }}-rc.tar.gz
            /tmp/bigdata-1.0-${{ inputs.component }}-${{ inputs.version }}-rc.tar.gz.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Prepare RPM repository tools
        run: |
          for attempt in 1 2 3; do
            if timeout 5m sudo apt-get update -qq &&
               timeout 5m sudo apt-get install -y createrepo-c git-lfs; then
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              exit 1
            fi
            sleep 15
          done

      - name: Checkout RPM repository base
        uses: actions/checkout@v4
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
        with:
          ref: main
          path: rpm-repository-pr
          lfs: false

      - name: Open and merge tested RPM pull request
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPONENT: ${{ inputs.component }}
          VERSION: ${{ inputs.version }}
          TEST_RUN_ID: ${{ inputs.test_run_id }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_IDENTITY: ${{ inputs.source_identity || '' }}
          COMPATIBILITY_IDENTITY: ${{ steps.catalog.outputs.compatibility_identity }}
          JDK_RUNTIME_ARCHIVE_SHA256: ${{ steps.catalog.outputs.jdk_runtime_archive_sha256 }}
          ARTIFACT_TYPE: ${{ inputs.artifact_type || 'service-rpm' }}
          TEST_PROFILE: ${{ inputs.test_profile || 'legacy-smoke' }}
          COMPONENT_JDK: ${{ inputs.jdk || '8' }}
          COMPONENT_JDK_PACKAGE: ${{ inputs.jdk_package }}
          REPO_CHECKOUT: ${{ github.workspace }}/rpm-repository-pr
        run: |
          set -euo pipefail
          BUILD_RUN_ID="$(awk -F ': ' '$1 == "build_run_id" { print $2 }' /tmp/test-evidence/evidence.md)"
          [[ "${BUILD_RUN_ID}" =~ ^[0-9]+$ ]]
          export BUILD_RUN_ID
          cd "${REPO_CHECKOUT}"
          git lfs install --local
          branch="ci/rpm-repo-${COMPONENT}-${VERSION}-${GITHUB_RUN_ID}"
          git switch -c "${branch}"
          mkdir -p repo
          cp "${GITHUB_WORKSPACE}/repo/.gitattributes" repo/.gitattributes
          cp "${GITHUB_WORKSPACE}/repo/README.md" repo/README.md
          bash "${GITHUB_WORKSPACE}/scripts/ci/stage-tested-rpms.sh"
          git add repo
          git diff --cached --check
          while IFS= read -r -d '' rpm; do
            relative="${rpm#./}"
            [[ "$(git check-attr filter -- "${relative}")" == *'filter: lfs' ]]
            [[ "$(git cat-file -s ":${relative}")" -lt 300 ]]
          done < <(find "repo/openeuler-22.03-lts-sp4/bigtop-3.6/${COMPONENT}/${VERSION}" \
            -maxdepth 1 -type f -name '*.rpm' -print0)
          if git diff --cached --quiet; then
            echo "RPM repository already contains ${COMPONENT} ${VERSION}." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "repo: add tested ${COMPONENT} ${VERSION} RPMs"
          git push origin "${branch}"
          body_file="$(mktemp)"
          cat > "${body_file}" <<EOF
          Adds the ${COMPONENT} ${VERSION} RPMs from tested artifact run ${TEST_RUN_ID}.
          Promotion workflow commit: ${SOURCE_SHA}
          Release candidate: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          pr_url="$(gh pr create --repo "${GITHUB_REPOSITORY}" \
            --base main --head "${branch}" \
            --title "repo: add tested ${COMPONENT} ${VERSION} RPMs" \
            --body-file "${body_file}")"
          echo "RPM repository PR: ${pr_url}" >> "${GITHUB_STEP_SUMMARY}"
          gh pr merge "${pr_url}" --repo "${GITHUB_REPOSITORY}" --squash
          echo "Merged tested RPMs into main/repo." >> "${GITHUB_STEP_SUMMARY}"

      - name: Publish GitHub prerelease
        if: github.event_name == 'workflow_dispatch' && inputs.publish_github_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="ci-${{ inputs.component }}-${{ inputs.version }}-${GITHUB_RUN_NUMBER}"
          archive="bigdata-1.0-${{ inputs.component }}-${{ inputs.version }}-rc.tar.gz"
          gh release create "${tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "BIGDATA ${{ inputs.component }} ${{ inputs.version }} RC" \
            --notes-file "${RELEASE_ROOT}/release-manifest.yaml" \
            --prerelease \
            "/tmp/${archive}" \
            "/tmp/${archive}.sha256" \
            "${RELEASE_ROOT}/SHA256SUMS" \
            "${RELEASE_ROOT}/release-manifest.yaml"
