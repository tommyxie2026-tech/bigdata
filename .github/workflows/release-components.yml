name: Release Components

on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
      version:
        required: true
        type: string
      test_run_id:
        required: true
        type: string
      artifact_type:
        required: false
        type: string
        default: service-rpm
      test_profile:
        required: false
        type: string
        default: legacy-smoke
      jdk:
        required: false
        type: string
        default: '8'
      jdk_package:
        required: false
        type: string
        default: java-1.8.0-openjdk
      source_identity:
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      component:
        description: Component to release
        required: true
        type: choice
        options:
          - zookeeper
          - hadoop
          - tez
          - hive
          - spark
          - hbase
          - kafka
          - flink
      version:
        description: Component version
        required: true
        type: string
      test_run_id:
        description: Successful Test Components run ID
        required: true
        type: string
      artifact_type:
        description: Artifact contract
        required: false
        default: ''
        type: string
      test_profile:
        description: Passing clean-environment test profile
        required: false
        default: ''
        type: string
      jdk:
        description: Component build/test JDK version
        required: false
        default: ''
        type: string
      jdk_package:
        description: Component JDK RPM used by the test
        required: false
        default: ''
        type: string
      source_identity:
        description: Immutable source commit or archive checksum
        required: false
        default: ''
        type: string
      publish_github_release:
        description: Publish GitHub prereleases
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: read
  pull-requests: write

jobs:
  release:
    name: Release ${{ inputs.component }} ${{ inputs.version }}
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    env:
      TEST_RUN_ID: ${{ inputs.test_run_id }}
      ARTIFACT_TYPE: ${{ inputs.artifact_type || '' }}
      TEST_PROFILE: ${{ inputs.test_profile || '' }}
      COMPONENT_JDK: ${{ inputs.jdk || '8' }}
      COMPONENT_JDK_PACKAGE: ${{ inputs.jdk_package || 'java-1.8.0-openjdk' }}
      EXPECTED_SOURCE_IDENTITY: ${{ inputs.source_identity || '' }}
      RELEASE_ROOT: /tmp/bigdata-release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download tested RPMs
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.component }}-${{ inputs.version }}-tested-rpms
          path: /tmp/tested-rpms
          run-id: ${{ env.TEST_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download test evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.component }}-${{ inputs.version }}-test-evidence
          path: /tmp/test-evidence
          run-id: ${{ env.TEST_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble release candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${RELEASE_ROOT}"
          mkdir -p "${RELEASE_ROOT}"/{rpms,evidence}

          find /tmp/tested-rpms -type f -name '*.rpm' -exec cp -v {} "${RELEASE_ROOT}/rpms/" \;
          cp -a /tmp/test-evidence/. "${RELEASE_ROOT}/evidence/"

          test_evidence="${RELEASE_ROOT}/evidence/evidence.md"
          grep -qx 'status: PASS' "${test_evidence}"
          grep -qx "component: ${{ inputs.component }}" "${test_evidence}"
          grep -qx "version: ${{ inputs.version }}" "${test_evidence}"
          evidence_artifact_type="$(awk -F ': ' '$1 == "artifact_type" { print $2 }' "${test_evidence}")"
          evidence_test_profile="$(awk -F ': ' '$1 == "test_profile" { print $2 }' "${test_evidence}")"
          evidence_jdk="$(awk -F ': ' '$1 == "toolchain_jdk" { print $2 }' "${test_evidence}")"
          evidence_jdk_package="$(awk -F ': ' '$1 == "jdk_package" { print $2 }' "${test_evidence}")"
          if [[ -n "${TEST_PROFILE}" && "${TEST_PROFILE}" != "${evidence_test_profile}" ]]; then
            echo "Requested test profile does not match the uploaded test evidence." >&2
            exit 1
          fi
          evidence_build_run_id="$(awk -F ': ' '$1 == "build_run_id" { print $2 }' "${test_evidence}")"
          evidence_test_run_id="$(awk -F ': ' '$1 == "test_run_id" { print $2 }' "${test_evidence}")"
          evidence_source_identity="$(awk -F ': ' '$1 == "source_identity" { print $2 }' "${test_evidence}")"
          if [[ "${evidence_test_profile}" != legacy-smoke ]]; then
            grep -qx "artifact_type: ${evidence_artifact_type}" "${test_evidence}"
            grep -qx "test_profile: ${evidence_test_profile}" "${test_evidence}"
            grep -qx "toolchain_jdk: ${evidence_jdk}" "${test_evidence}"
            grep -qx "jdk_package: ${evidence_jdk_package}" "${test_evidence}"
            grep -qx "test_run_id: ${TEST_RUN_ID}" "${test_evidence}"
            [[ -n "${evidence_artifact_type}" && -n "${evidence_test_profile}" && -n "${evidence_jdk}" && -n "${evidence_jdk_package}" ]]
            [[ "${evidence_test_run_id}" == "${TEST_RUN_ID}" && "${evidence_build_run_id}" =~ ^[0-9]+$ ]]
            if [[ -n "${ARTIFACT_TYPE}" && "${ARTIFACT_TYPE}" != "${evidence_artifact_type}" ]]; then
              echo "Requested artifact type does not match the uploaded test evidence." >&2
              exit 1
            fi
            if [[ -n "${EXPECTED_SOURCE_IDENTITY}" && "${EXPECTED_SOURCE_IDENTITY}" != "${evidence_source_identity}" ]]; then
              echo "Requested source identity does not match the uploaded test evidence." >&2
              exit 1
            fi
          fi
          source_identity="$(awk -F ': ' '$1 == "source_identity" { print $2 }' "${test_evidence}")"
          build_run_id="$(awk -F ': ' '$1 == "build_run_id" { print $2 }' "${test_evidence}")"
          ARTIFACT_TYPE="${evidence_artifact_type:-${ARTIFACT_TYPE:-service-rpm}}"
          TEST_PROFILE="${evidence_test_profile:-${TEST_PROFILE:-legacy-smoke}}"
          COMPONENT_JDK="${evidence_jdk:-${COMPONENT_JDK:-8}}"
          COMPONENT_JDK_PACKAGE="${evidence_jdk_package:-${COMPONENT_JDK_PACKAGE:-java-1.8.0-openjdk}}"
          if [[ -n "${EXPECTED_SOURCE_IDENTITY}" && "${source_identity}" != "${EXPECTED_SOURCE_IDENTITY}" ]]; then
            echo "Test evidence source identity ${source_identity} does not match ${EXPECTED_SOURCE_IDENTITY}." >&2
            exit 1
          fi
          [[ "${build_run_id}" =~ ^[0-9]+$ ]]
          [[ "${TEST_RUN_ID}" =~ ^[0-9]+$ ]]

          rpm_count=$(find "${RELEASE_ROOT}/rpms" -type f -name '*.rpm' | wc -l)
          test "${rpm_count}" -gt 0

          (
            cd "${RELEASE_ROOT}"
            find rpms -type f -name '*.rpm' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )

          cat > "${RELEASE_ROOT}/release-manifest.yaml" <<EOF
          schema: bigdata.release/v2
          component: ${{ inputs.component }}
          component_version: ${{ inputs.version }}
          bigtop_version: 3.6.0
          artifact_type: ${ARTIFACT_TYPE}
          source_identity: ${source_identity}
          test_profile: ${TEST_PROFILE}
          jdk: ${COMPONENT_JDK}
          jdk_package: ${COMPONENT_JDK_PACKAGE}
          build_run_id: ${build_run_id}
          test_run_id: ${TEST_RUN_ID}
          os: openEuler 22.03 LTS SP4
          package_format: RPM
          rpm_count: ${rpm_count}
          status: RELEASE_CANDIDATE
          EOF

          archive="bigdata-1.0-${{ inputs.component }}-${{ inputs.version }}-rc.tar.gz"
          tar -C "${RELEASE_ROOT}" -czf "/tmp/${archive}" .
          sha256sum "/tmp/${archive}" > "/tmp/${archive}.sha256"

          cat "${RELEASE_ROOT}/release-manifest.yaml" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: bigdata-1.0-${{ inputs.component }}-${{ inputs.version }}-rc
          path: |
            /tmp/bigdata-release
            /tmp/bigdata-1.0-${{ inputs.component }}-${{ inputs.version }}-rc.tar.gz
            /tmp/bigdata-1.0-${{ inputs.component }}-${{ inputs.version }}-rc.tar.gz.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Prepare RPM repository tools
        run: |
          for attempt in 1 2 3; do
            if timeout 5m sudo apt-get update -qq &&
               timeout 5m sudo apt-get install -y createrepo-c git-lfs; then
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              exit 1
            fi
            sleep 15
          done

      - name: Checkout RPM repository base
        uses: actions/checkout@v4
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
        with:
          ref: main
          path: rpm-repository-pr
          lfs: false

      - name: Open and merge tested RPM pull request
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPONENT: ${{ inputs.component }}
          VERSION: ${{ inputs.version }}
          TEST_RUN_ID: ${{ inputs.test_run_id }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_IDENTITY: ${{ inputs.source_identity || '' }}
          ARTIFACT_TYPE: ${{ inputs.artifact_type || 'service-rpm' }}
          TEST_PROFILE: ${{ inputs.test_profile || 'legacy-smoke' }}
          COMPONENT_JDK: ${{ inputs.jdk || '8' }}
          COMPONENT_JDK_PACKAGE: ${{ inputs.jdk_package || 'java-1.8.0-openjdk' }}
          REPO_CHECKOUT: ${{ github.workspace }}/rpm-repository-pr
        run: |
          set -euo pipefail
          BUILD_RUN_ID="$(awk -F ': ' '$1 == "build_run_id" { print $2 }' /tmp/test-evidence/evidence.md)"
          [[ "${BUILD_RUN_ID}" =~ ^[0-9]+$ ]]
          export BUILD_RUN_ID
          cd "${REPO_CHECKOUT}"
          git lfs install --local
          branch="ci/rpm-repo-${COMPONENT}-${VERSION}-${GITHUB_RUN_ID}"
          git switch -c "${branch}"
          mkdir -p repo
          cp "${GITHUB_WORKSPACE}/repo/.gitattributes" repo/.gitattributes
          cp "${GITHUB_WORKSPACE}/repo/README.md" repo/README.md
          bash "${GITHUB_WORKSPACE}/scripts/ci/stage-tested-rpms.sh"
          git add repo
          git diff --cached --check
          while IFS= read -r -d '' rpm; do
            relative="${rpm#./}"
            [[ "$(git check-attr filter -- "${relative}")" == *'filter: lfs' ]]
            [[ "$(git cat-file -s ":${relative}")" -lt 300 ]]
          done < <(find "repo/openeuler-22.03-lts-sp4/bigtop-3.6/${COMPONENT}/${VERSION}" \
            -maxdepth 1 -type f -name '*.rpm' -print0)
          if git diff --cached --quiet; then
            echo "RPM repository already contains ${COMPONENT} ${VERSION}." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "repo: add tested ${COMPONENT} ${VERSION} RPMs"
          git push origin "${branch}"
          body_file="$(mktemp)"
          cat > "${body_file}" <<EOF
          Adds the ${COMPONENT} ${VERSION} RPMs from tested artifact run ${TEST_RUN_ID}.
          Promotion workflow commit: ${SOURCE_SHA}
          Release candidate: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          pr_url="$(gh pr create --repo "${GITHUB_REPOSITORY}" \
            --base main --head "${branch}" \
            --title "repo: add tested ${COMPONENT} ${VERSION} RPMs" \
            --body-file "${body_file}")"
          echo "RPM repository PR: ${pr_url}" >> "${GITHUB_STEP_SUMMARY}"
          gh pr merge "${pr_url}" --repo "${GITHUB_REPOSITORY}" --squash
          echo "Merged tested RPMs into main/repo." >> "${GITHUB_STEP_SUMMARY}"

      - name: Publish GitHub prerelease
        if: github.event_name == 'workflow_dispatch' && inputs.publish_github_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="ci-${{ inputs.component }}-${{ inputs.version }}-${GITHUB_RUN_NUMBER}"
          archive="bigdata-1.0-${{ inputs.component }}-${{ inputs.version }}-rc.tar.gz"
          gh release create "${tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "BIGDATA ${{ inputs.component }} ${{ inputs.version }} RC" \
            --notes-file "${RELEASE_ROOT}/release-manifest.yaml" \
            --prerelease \
            "/tmp/${archive}" \
            "/tmp/${archive}.sha256" \
            "${RELEASE_ROOT}/SHA256SUMS" \
            "${RELEASE_ROOT}/release-manifest.yaml"
