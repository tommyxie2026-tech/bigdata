name: Hue dependency preflight

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/hue-dependency-preflight.yml"
      - "docs/hue-feasibility.md"
      - "scripts/ci/preflight-hue-dependencies.sh"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/hue-dependency-preflight.yml"
      - "docs/hue-feasibility.md"
      - "scripts/ci/preflight-hue-dependencies.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hue-dependency-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openEuler-dependencies:
    name: Resolve Hue prerequisites on openEuler 22.03 SP4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENEULER_IMAGE: openeuler/openeuler:22.03-lts-sp4
      HUE_SOURCE_IDENTITY: 65d9e489f400ac151029b33c5a2bd9df31e167da
      HUE_VERSION: '4.11.0'
    steps:
      - name: Checkout BIGDATA
        uses: actions/checkout@v4

      - name: Pull and identify target image
        shell: bash
        run: |
          set -euo pipefail
          docker pull "${OPENEULER_IMAGE}"
          docker image inspect "${OPENEULER_IMAGE}" \
            --format 'image={{.RepoTags}} digests={{.RepoDigests}}'

      - name: Resolve native and Python packages (no Hue build)
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --name bigdata-hue-build-input-preflight \
            -e HUE_SOURCE_IDENTITY="${HUE_SOURCE_IDENTITY}" \
            -e HUE_VERSION="${HUE_VERSION}" \
            -v "${GITHUB_WORKSPACE}:/workspace:ro" \
            "${OPENEULER_IMAGE}" \
            bash /workspace/scripts/ci/preflight-hue-dependencies.sh
