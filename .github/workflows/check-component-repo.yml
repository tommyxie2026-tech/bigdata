name: Check Existing Component RPMs

on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
      version:
        required: true
        type: string
      source_identity:
        required: false
        type: string
        default: ''
      artifact_type:
        required: false
        type: string
        default: ''
      test_profile:
        required: false
        type: string
        default: ''
      jdk:
        required: false
        type: string
        default: ''
      jdk_package:
        required: false
        type: string
        default: ''
    outputs:
      already_current:
        description: Whether main contains the exact tested, installable RPM set
        value: ${{ jobs.check.outputs.already_current }}

permissions:
  contents: read

jobs:
  check:
    name: Verify existing ${{ inputs.component }} ${{ inputs.version }} RPMs
    timeout-minutes: 20
    runs-on: ubuntu-latest
    outputs:
      already_current: ${{ steps.repo.outputs.already_current }}
    steps:
      - name: Checkout workflow and component config
        uses: actions/checkout@v4

      - name: Resolve component dependency repositories
        id: dependency-repos
        shell: bash
        env:
          COMPONENT: ${{ inputs.component }}
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pyyaml
          python3 scripts/ci/resolve-component-dependencies.py \
            --config ci/components.yaml \
            --component "${COMPONENT}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Checkout component and common repositories from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: rpm-repository
          lfs: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            repo/openeuler-22.03-lts-sp4/bigtop-3.6/${{ inputs.component }}/${{ inputs.version }}/
            repo/openeuler-22.03-lts-sp4/bigtop-3.6/common/3.6.0/
            ${{ steps.dependency-repos.outputs.sparse_paths }}

      - name: Verify content, source identity, and clean DNF installation
        id: repo
        shell: bash
        env:
          COMPONENT: ${{ inputs.component }}
          VERSION: ${{ inputs.version }}
          SOURCE_IDENTITY: ${{ inputs.source_identity }}
          ARTIFACT_TYPE: ${{ inputs.artifact_type }}
          TEST_PROFILE: ${{ inputs.test_profile }}
          COMPONENT_JDK: ${{ inputs.jdk }}
          COMPONENT_JDK_PACKAGE: ${{ inputs.jdk_package }}
          COMPATIBILITY_IDENTITY: ${{ steps.dependency-repos.outputs.compatibility_identity }}
        run: |
          set -euo pipefail
          set +e
          python3 scripts/ci/check-component-repo-fast-path.py \
            --component "${COMPONENT}" \
            --version "${VERSION}" \
            --repo-checkout "${GITHUB_WORKSPACE}/rpm-repository" \
            --components-file "${GITHUB_WORKSPACE}/ci/components.yaml" \
            --source-identity "${SOURCE_IDENTITY}" \
            --compatibility-identity "${COMPATIBILITY_IDENTITY}" \
            --artifact-type "${ARTIFACT_TYPE}" \
            --test-profile "${TEST_PROFILE}" \
            --jdk "${COMPONENT_JDK}" \
            --jdk-package "${COMPONENT_JDK_PACKAGE}"
          check_result=$?
          set -e

          install_result=125
          if [[ "${check_result}" -eq 0 ]]; then
          read -r -a package_names <<< "${{ steps.dependency-repos.outputs.packages }}"
            package_list=$(printf '%s\n' "${package_names[@]}")
            repo_root="${GITHUB_WORKSPACE}/rpm-repository/repo/openeuler-22.03-lts-sp4/bigtop-3.6"
            if docker pull openeuler/openeuler:22.03-lts-sp4 && \
               docker run --rm \
                -v "${repo_root}:/bigdata-repo:ro" \
                -v "${GITHUB_WORKSPACE}/scripts/ci/verify-component-repo-install.sh:/verify-component-repo-install.sh:ro" \
                -e COMPONENT="${COMPONENT}" \
                -e VERSION="${VERSION}" \
                -e PACKAGE_LIST="${package_list}" \
                -e DEPENDENCY_REPO_PATHS="${{ steps.dependency-repos.outputs.dependency_repos }}" \
                openeuler/openeuler:22.03-lts-sp4 \
                bash /verify-component-repo-install.sh; then
              install_result=0
            else
              install_result=1
            fi
          fi

          CHECK_RESULT="${check_result}" INSTALL_RESULT="${install_result}" \
            bash scripts/ci/set-component-repo-fast-path-result.sh
          if grep -qx 'already_current=true' "${GITHUB_OUTPUT}"; then
            echo "Fast path accepted after exact RPM/manifest/checksum and clean DNF install." >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "Normal Build/Test/Release required for ${COMPONENT} ${VERSION}." >> "${GITHUB_STEP_SUMMARY}"
          fi
