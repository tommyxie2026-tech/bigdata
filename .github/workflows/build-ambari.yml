name: Build Ambari

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-ambari.yml"
      - "scripts/ci/*ambari*.sh"
      - "ci/components.yaml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/build-ambari.yml"
      - "scripts/ci/*ambari*.sh"
      - "ci/components.yaml"

permissions:
  contents: read
  actions: read

concurrency:
  group: build-ambari-${{ github.ref }}
  cancel-in-progress: false

env:
  AMBARI_VERSION: 3.0.0
  AMBARI_REF: release-3.0.0
  OPENEULER_IMAGE: openeuler/openeuler:22.03-lts-sp4

jobs:
  build:
    name: Build Ambari 3.0.0 RPMs
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      WORK_ROOT: /tmp/bigdata-ambari-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runner capacity
        run: |
          df -h
          free -h
          docker version

      - name: Restore Maven downloads
        uses: actions/cache@v4
        with:
          path: /tmp/bigdata-ambari-cache/m2
          key: openeuler22-ambari300-jdk17-${{ hashFiles('ci/components.yaml', 'scripts/ci/build-ambari-rpms.sh') }}

      - name: Build Ambari Server and Agent RPMs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${WORK_ROOT}"
          mkdir -p "${WORK_ROOT}" /tmp/bigdata-ambari-cache/m2
          docker pull "${OPENEULER_IMAGE}"
          docker run --rm \
            -e AMBARI_REF \
            -e AMBARI_VERSION \
            -e WORK_ROOT=/work \
            -v "${GITHUB_WORKSPACE}:/workspace:ro" \
            -v "${WORK_ROOT}:/work" \
            -v /tmp/bigdata-ambari-cache/m2:/root/.m2 \
            "${OPENEULER_IMAGE}" \
            bash /workspace/scripts/ci/build-ambari-rpms.sh

      - name: Publish build summary
        if: always()
        run: |
          test ! -f "${WORK_ROOT}/artifacts/evidence/evidence.md" || \
            cat "${WORK_ROOT}/artifacts/evidence/evidence.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Ambari RPM artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ambari-3.0.0-openeuler22-rpm
          path: /tmp/bigdata-ambari-build/artifacts
          if-no-files-found: error
          retention-days: 14

  test:
    name: Test Ambari 3.0.0 RPMs
    needs: build
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ARTIFACT_ROOT: /tmp/bigdata-ambari-artifact
      EVIDENCE_ROOT: /tmp/bigdata-ambari-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Ambari RPMs
        uses: actions/download-artifact@v4
        with:
          name: ambari-3.0.0-openeuler22-rpm
          path: /tmp/bigdata-ambari-artifact

      - name: Run clean-container install smoke
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${EVIDENCE_ROOT}"
          mkdir -p "${EVIDENCE_ROOT}"
          docker pull "${OPENEULER_IMAGE}"
          docker run --rm \
            -e AMBARI_VERSION \
            -e ARTIFACT_ROOT=/artifact \
            -e EVIDENCE_ROOT=/evidence \
            -v "${GITHUB_WORKSPACE}:/workspace:ro" \
            -v "${ARTIFACT_ROOT}:/artifact:ro" \
            -v "${EVIDENCE_ROOT}:/evidence" \
            "${OPENEULER_IMAGE}" \
            bash /workspace/scripts/ci/test-ambari-rpms.sh

      - name: Publish test summary
        if: always()
        run: |
          test ! -f "${EVIDENCE_ROOT}/evidence.md" || \
            cat "${EVIDENCE_ROOT}/evidence.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ambari-3.0.0-test-evidence
          path: /tmp/bigdata-ambari-test
          if-no-files-found: error
          retention-days: 30

      - name: Upload tested RPMs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ambari-3.0.0-tested-rpms
          path: /tmp/bigdata-ambari-artifact
          if-no-files-found: error
          retention-days: 30

  release:
    name: Release Ambari 3.0.0 candidate
    needs: test
    if: ${{ always() && needs.test.result == 'success' && github.event_name != 'pull_request' }}
    permissions:
      contents: write
      actions: read
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RELEASE_ROOT: /tmp/bigdata-ambari-release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download tested RPMs
        uses: actions/download-artifact@v4
        with:
          name: ambari-3.0.0-tested-rpms
          path: /tmp/tested-rpms

      - name: Download test evidence
        uses: actions/download-artifact@v4
        with:
          name: ambari-3.0.0-test-evidence
          path: /tmp/test-evidence

      - name: Assemble release candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${RELEASE_ROOT}"
          mkdir -p "${RELEASE_ROOT}"/{rpms,evidence}
          find /tmp/tested-rpms/rpms -maxdepth 1 -type f -name '*.rpm' \
            -exec cp -v {} "${RELEASE_ROOT}/rpms/" \;
          cp -a /tmp/test-evidence/. "${RELEASE_ROOT}/evidence/"
          rpm_count="$(find "${RELEASE_ROOT}/rpms" -type f -name '*.rpm' | wc -l | tr -d ' ')"
          test "${rpm_count}" -eq 3
          (
            cd "${RELEASE_ROOT}"
            find rpms -type f -name '*.rpm' -print0 | sort -z | \
              xargs -0 -r sha256sum > SHA256SUMS
          )
          cat > "${RELEASE_ROOT}/release-manifest.yaml" <<EOF
          schema: bigdata.release/v1
          component: ambari
          component_version: ${AMBARI_VERSION}
          ambari_ref: ${AMBARI_REF}
          os: openEuler 22.03 LTS SP4
          package_format: RPM
          test_run_id: ${GITHUB_RUN_ID}
          rpm_count: ${rpm_count}
          status: RELEASE_CANDIDATE
          EOF
          archive="bigdata-1.0-ambari-${AMBARI_VERSION}-rc.tar.gz"
          tar -C "${RELEASE_ROOT}" -czf "/tmp/${archive}" .
          sha256sum "/tmp/${archive}" > "/tmp/${archive}.sha256"
          cat "${RELEASE_ROOT}/release-manifest.yaml" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: bigdata-1.0-ambari-3.0.0-rc
          path: |
            /tmp/bigdata-ambari-release
            /tmp/bigdata-1.0-ambari-3.0.0-rc.tar.gz
            /tmp/bigdata-1.0-ambari-3.0.0-rc.tar.gz.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Prepare RPM repository tools
        run: |
          for attempt in 1 2 3; do
            if timeout 5m sudo apt-get update -qq && \
               timeout 5m sudo apt-get install -y createrepo-c git-lfs; then
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              exit 1
            fi
            sleep 15
          done

      - name: Checkout RPM repository base
        uses: actions/checkout@v4
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
        with:
          ref: main
          path: rpm-repository-pr
          lfs: false

      - name: Open and merge tested Ambari RPM pull request
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ env.AMBARI_VERSION }}
          TEST_RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
          REPO_CHECKOUT: ${{ github.workspace }}/rpm-repository-pr
        run: |
          set -euo pipefail
          cd "${REPO_CHECKOUT}"
          git lfs install --local
          branch="ci/rpm-repo-ambari-${VERSION}-${GITHUB_RUN_ID}"
          git switch -c "${branch}"
          mkdir -p repo
          cp "${GITHUB_WORKSPACE}/repo/.gitattributes" repo/.gitattributes
          cp "${GITHUB_WORKSPACE}/repo/README.md" repo/README.md
          bash "${GITHUB_WORKSPACE}/scripts/ci/stage-tested-ambari-rpms.sh"
          git add repo
          git diff --cached --check
          target="repo/openeuler-22.03-lts-sp4/ambari/${VERSION}"
          while IFS= read -r -d '' rpm; do
            [[ "$(git check-attr filter -- "${rpm}")" == *'filter: lfs' ]]
            [[ "$(git cat-file -s ":${rpm}")" -lt 300 ]]
          done < <(find "${target}" -maxdepth 1 -type f -name '*.rpm' -print0)
          if git diff --cached --quiet; then
            echo "RPM repository already contains Ambari ${VERSION}." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "repo: add tested Ambari ${VERSION} RPMs"
          git push origin "${branch}"
          body_file="$(mktemp)"
          cat > "${body_file}" <<EOF
          Adds Ambari Server and Agent ${VERSION} RPMs from tested workflow run ${TEST_RUN_ID}.
          Promotion workflow commit: ${SOURCE_SHA}
          Release candidate: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          pr_url="$(gh pr create --repo "${GITHUB_REPOSITORY}" \
            --base main --head "${branch}" \
            --title "repo: add tested Ambari ${VERSION} RPMs" \
            --body-file "${body_file}")"
          echo "Ambari RPM repository PR: ${pr_url}" >> "${GITHUB_STEP_SUMMARY}"
          gh pr merge "${pr_url}" --repo "${GITHUB_REPOSITORY}" --squash
          echo "Merged tested Ambari RPMs into main/repo." >> "${GITHUB_STEP_SUMMARY}"
