name: Test Components

on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
      version:
        required: true
        type: string
      build_run_id:
        required: true
        type: string
      test_profile:
        required: false
        type: string
        default: legacy-smoke
      builder:
        required: false
        type: string
        default: bigtop
      artifact_type:
        required: false
        type: string
        default: service-rpm
      jdk:
        required: false
        type: string
        default: '8'
      jdk_package:
        required: false
        type: string
        default: java-1.8.0-openjdk
      source_identity:
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      component:
        description: Component to test
        required: true
        type: choice
        options:
          - zookeeper
          - hadoop
          - tez
          - hive
          - spark
          - hbase
          - kafka
          - flink
          - trino
      version:
        description: Component version
        required: true
        type: string
      build_run_id:
        description: Successful Build Components run ID
        required: true
        type: string
      test_profile:
        description: Component-specific clean-environment test profile
        required: false
        default: legacy-smoke
        type: string
      builder:
        description: Build adapter selected by the component catalog
        required: false
        default: bigtop
        type: string
      artifact_type:
        description: Artifact contract from the component catalog
        required: false
        default: service-rpm
        type: string
      jdk:
        description: Component build/test JDK version
        required: false
        default: '8'
        type: string
      jdk_package:
        description: Component JDK runtime RPM
        required: false
        default: java-1.8.0-openjdk
        type: string
      source_identity:
        description: Immutable source commit or archive checksum
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

jobs:
  test:
    name: Test ${{ inputs.component }} ${{ inputs.version }}
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      OPENEULER_IMAGE: openeuler/openeuler:22.03-lts-sp4
      ARTIFACT_ROOT: /tmp/bigdata-component-artifact
      EVIDENCE_ROOT: /tmp/bigdata-component-test
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      TEST_PROFILE: ${{ inputs.test_profile }}
      BUILDER: ${{ inputs.builder || 'bigtop' }}
      COMPONENT_JDK: ${{ inputs.jdk || '8' }}
      COMPONENT_JDK_PACKAGE: ${{ inputs.jdk_package }}
      ARTIFACT_TYPE: ${{ inputs.artifact_type || 'service-rpm' }}
      EXPECTED_SOURCE_IDENTITY: ${{ inputs.source_identity || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Resolve runtime package contract
        id: catalog
        shell: bash
        env:
          COMPONENT: ${{ inputs.component }}
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pyyaml
          python3 scripts/ci/resolve-component-dependencies.py \
            --config ci/components.yaml \
            --component "${COMPONENT}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Resolve component test adapter
        id: adapter
        env:
          COMPONENT: ${{ inputs.component }}
          BUILD_TASK: ${{ inputs.component }}-rpm
          BUILDER: ${{ inputs.builder || 'bigtop' }}
          TEST_PROFILE: ${{ inputs.test_profile || 'legacy-smoke' }}
        run: |
          python3 scripts/ci/resolve-component-adapter.py \
            --builder "${BUILDER}" \
            --component "${COMPONENT}" \
            --operation test \
            --task "${BUILD_TASK}" \
            --test-profile "${TEST_PROFILE}" \
            --scripts-dir scripts/ci \
            --github-output "${GITHUB_OUTPUT}"

      - name: Checkout dependency RPM repositories
        uses: actions/checkout@v4
        with:
          ref: main
          path: dependency-repository
          lfs: true
          sparse-checkout-cone-mode: false
          sparse-checkout: ${{ steps.catalog.outputs.sparse_paths }}

      - name: Download component RPMs
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.component }}-${{ inputs.version }}-bigtop-3.6-openeuler22-rpm
          path: /tmp/bigdata-component-artifact
          run-id: ${{ env.BUILD_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run install smoke
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${EVIDENCE_ROOT}"
          mkdir -p "${EVIDENCE_ROOT}"
          docker pull "${OPENEULER_IMAGE}"
          docker run --rm \
            -e COMPONENT="${{ inputs.component }}" \
            -e VERSION="${{ inputs.version }}" \
            -e TEST_PROFILE="${{ inputs.test_profile || 'legacy-smoke' }}" \
            -e BUILDER="${{ inputs.builder || 'bigtop' }}" \
            -e ARTIFACT_TYPE="${{ inputs.artifact_type || 'service-rpm' }}" \
            -e COMPONENT_JDK="${{ inputs.jdk || '8' }}" \
            -e COMPONENT_JDK_PACKAGE="${{ inputs.jdk_package }}" \
            -e EXPECTED_SOURCE_IDENTITY="${{ inputs.source_identity || '' }}" \
            -e COMPONENT_COMPATIBILITY_IDENTITY="${{ steps.catalog.outputs.compatibility_identity }}" \
            -e JDK_RUNTIME_ARCHIVE_URL="${{ steps.catalog.outputs.jdk_runtime_archive_url }}" \
            -e JDK_RUNTIME_ARCHIVE_SHA256="${{ steps.catalog.outputs.jdk_runtime_archive_sha256 }}" \
            -e COMPONENT_RUNTIME_PACKAGES="${{ steps.catalog.outputs.packages }}" \
            -e BUILD_RUN_ID="${BUILD_RUN_ID}" \
            -e TEST_RUN_ID="${GITHUB_RUN_ID}" \
            -e DEPENDENCY_REPO_PATHS="${{ steps.catalog.outputs.dependency_repos }}" \
            -e ARTIFACT_ROOT=/artifact \
            -e EVIDENCE_ROOT=/evidence \
            -v "${GITHUB_WORKSPACE}:/workspace:ro" \
            -v "${GITHUB_WORKSPACE}/dependency-repository/repo/openeuler-22.03-lts-sp4/bigtop-3.6:/dependency-repos:ro" \
            -v "${ARTIFACT_ROOT}:/artifact:ro" \
            -v "${EVIDENCE_ROOT}:/evidence" \
            "${OPENEULER_IMAGE}" \
            bash "/workspace/scripts/ci/${{ steps.adapter.outputs.script }}"

      - name: Publish summary
        if: always()
        run: |
          test ! -f "${EVIDENCE_ROOT}/evidence.md" ||             cat "${EVIDENCE_ROOT}/evidence.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.component }}-${{ inputs.version }}-test-evidence
          path: /tmp/bigdata-component-test
          if-no-files-found: error
          retention-days: 14

      - name: Upload tested RPMs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.component }}-${{ inputs.version }}-tested-rpms
          path: /tmp/bigdata-component-artifact
          if-no-files-found: error
          retention-days: 30
