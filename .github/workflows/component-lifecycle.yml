name: New Component Lifecycle

on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
      version:
        required: true
        type: string
      builder:
        required: true
        type: string
      artifact_type:
        required: true
        type: string
      build_task:
        required: true
        type: string
      test_profile:
        required: true
        type: string
      jdk:
        required: true
        type: string
      jdk_package:
        required: true
        type: string
      source_identity:
        required: true
        type: string
    outputs:
      stage_passed:
        description: True only for a verified fast path or completed lifecycle
        value: ${{ jobs.gate.outputs.stage_passed }}

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  repo_check:
    name: Check ${{ inputs.component }} repository fast path
    uses: ./.github/workflows/check-component-repo.yml
    with:
      component: ${{ inputs.component }}
      version: ${{ inputs.version }}
      source_identity: ${{ inputs.source_identity }}
      artifact_type: ${{ inputs.artifact_type }}
      test_profile: ${{ inputs.test_profile }}
      jdk: ${{ inputs.jdk }}
      jdk_package: ${{ inputs.jdk_package }}

  pr_test_reuse:
    name: Reuse verified merged PR test artifacts for ${{ inputs.component }}
    needs: repo_check
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.repo_check.result == 'success' &&
      needs.repo_check.outputs.already_current != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      test_run_id: ${{ steps.lookup.outputs.test_run_id }}
    steps:
      - name: Checkout merged workflow code
        uses: actions/checkout@v4

      - name: Find a successful same-tree PR Build/Test run
        id: lookup
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMPONENT: ${{ inputs.component }}
          VERSION: ${{ inputs.version }}
        run: python3 scripts/ci/reuse_merged_pr_test_artifacts.py

  build:
    name: Build ${{ inputs.component }} ${{ inputs.version }}
    needs: [repo_check, pr_test_reuse]
    if: >-
      always() &&
      needs.repo_check.result == 'success' &&
      needs.repo_check.outputs.already_current != 'true' &&
      needs.pr_test_reuse.outputs.test_run_id == ''
    uses: ./.github/workflows/build-one-component.yml
    with:
      component: ${{ inputs.component }}
      version: ${{ inputs.version }}
      task: ${{ inputs.build_task }}
      builder: ${{ inputs.builder }}
      artifact_type: ${{ inputs.artifact_type }}
      test_profile: ${{ inputs.test_profile }}
      jdk: ${{ inputs.jdk }}
      jdk_package: ${{ inputs.jdk_package }}
      source_identity: ${{ inputs.source_identity }}

  test:
    name: Test ${{ inputs.component }} ${{ inputs.version }}
    needs: [build, pr_test_reuse]
    if: ${{ always() && needs.build.result == 'success' }}
    uses: ./.github/workflows/test-components.yml
    with:
      component: ${{ inputs.component }}
      version: ${{ inputs.version }}
      build_run_id: ${{ format('{0}', github.run_id) }}
      test_profile: ${{ inputs.test_profile }}
      builder: ${{ inputs.builder }}
      artifact_type: ${{ inputs.artifact_type }}
      jdk: ${{ inputs.jdk }}
      jdk_package: ${{ inputs.jdk_package }}
      source_identity: ${{ inputs.source_identity }}

  release:
    name: Release Candidate ${{ inputs.component }} ${{ inputs.version }}
    needs: [test, pr_test_reuse]
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      (needs.test.result == 'success' || needs.pr_test_reuse.outputs.test_run_id != '')
    permissions:
      contents: write
      actions: read
      pull-requests: write
    uses: ./.github/workflows/release-components.yml
    with:
      component: ${{ inputs.component }}
      version: ${{ inputs.version }}
      test_run_id: ${{ needs.pr_test_reuse.outputs.test_run_id || format('{0}', github.run_id) }}
      artifact_type: ${{ inputs.artifact_type }}
      test_profile: ${{ inputs.test_profile }}
      jdk: ${{ inputs.jdk }}
      jdk_package: ${{ inputs.jdk_package }}
      source_identity: ${{ inputs.source_identity }}

  gate:
    name: Complete ${{ inputs.component }} stage
    needs: [repo_check, pr_test_reuse, build, test, release]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      stage_passed: ${{ steps.gate.outputs.stage_passed }}
    steps:
      - name: Accept only verified fast path or successful lifecycle
        id: gate
        env:
          CHECK_RESULT: ${{ needs.repo_check.result }}
          ALREADY_CURRENT: ${{ needs.repo_check.outputs.already_current }}
          PR_TEST_RUN_ID: ${{ needs.pr_test_reuse.outputs.test_run_id }}
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.test.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
          EVENT_NAME: ${{ github.event_name }}
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${CHECK_RESULT}" == success && "${ALREADY_CURRENT}" == true && \
                "${BUILD_RESULT}" == skipped && "${TEST_RESULT}" == skipped && \
                "${RELEASE_RESULT}" == skipped ]]; then
            echo 'stage_passed=true' >> "${GITHUB_OUTPUT}"
          elif [[ "${CHECK_RESULT}" == success && "${BUILD_RESULT}" == skipped && \
                  "${TEST_RESULT}" == skipped && "${RELEASE_RESULT}" == success && \
                  "${PR_TEST_RUN_ID}" =~ ^[0-9]+$ ]]; then
            echo 'stage_passed=true' >> "${GITHUB_OUTPUT}"
            echo "Promoted verified PR test artifacts from run ${PR_TEST_RUN_ID}." >> "${GITHUB_STEP_SUMMARY}"
          elif [[ "${CHECK_RESULT}" == success && "${BUILD_RESULT}" == success && \
                  "${TEST_RESULT}" == success && \
                  ( "${RELEASE_RESULT}" == success || \
                    ( "${EVENT_NAME}" == pull_request && "${RELEASE_RESULT}" == skipped ) ) ]]; then
            echo 'stage_passed=true' >> "${GITHUB_OUTPUT}"
          elif [[ "${EVENT_NAME}" == pull_request && "${IS_FORK_PR}" == true && \
                  "${BUILD_RESULT}" == skipped && "${TEST_RESULT}" == skipped && \
                  "${RELEASE_RESULT}" == skipped ]]; then
            echo 'stage_passed=false' >> "${GITHUB_OUTPUT}"
            echo 'Build/Test/Release are intentionally unavailable to fork PRs.'
          else
            echo "Component stage failed: check=${CHECK_RESULT}, fast_path=${ALREADY_CURRENT}, build=${BUILD_RESULT}, test=${TEST_RESULT}, release=${RELEASE_RESULT}" >&2
            exit 1
          fi
