name: Build One Component

on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
      version:
        required: true
        type: string
      task:
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build ${{ inputs.component }} ${{ inputs.version }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 240

    env:
      OPENEULER_IMAGE: openeuler/openeuler:22.03-lts-sp4
      WORK_ROOT: /tmp/bigdata-component-build

    steps:
      - uses: actions/checkout@v4

      - name: Runner capacity
        run: |
          df -h
          free -h
          docker version

      - name: Restore Maven and Gradle downloads
        uses: actions/cache@v4
        with:
          path: |
            /tmp/bigdata-component-cache/m2
            /tmp/bigdata-component-cache/gradle
          key: openeuler22-bigtop36-jdk8-${{ hashFiles('ci/components.yaml', 'scripts/ci/build-bigtop-component.sh') }}

      - name: Build RPMs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${WORK_ROOT}"
          mkdir -p "${WORK_ROOT}" /tmp/bigdata-component-cache/{m2,gradle}
          docker pull "${OPENEULER_IMAGE}"
          docker run --rm \
            -e COMPONENT="${{ inputs.component }}" \
            -e VERSION="${{ inputs.version }}" \
            -e BUILD_TASK="${{ inputs.task }}" \
            -e BIGTOP_REF=branch-3.6 \
            -e WORK_ROOT=/work \
            -v "${GITHUB_WORKSPACE}:/workspace:ro" \
            -v "${WORK_ROOT}:/work" \
            -v /tmp/bigdata-component-cache/m2:/root/.m2 \
            -v /tmp/bigdata-component-cache/gradle:/root/.gradle \
            "${OPENEULER_IMAGE}" \
            bash /workspace/scripts/ci/build-bigtop-component.sh

      - name: Publish summary
        if: always()
        run: |
          test ! -f "${WORK_ROOT}/artifacts/evidence/evidence.md" ||             cat "${WORK_ROOT}/artifacts/evidence/evidence.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload RPM artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.component }}-${{ inputs.version }}-bigtop-3.6-openeuler22-rpm
          path: /tmp/bigdata-component-build/artifacts
          if-no-files-found: error
          retention-days: 14
