schema: bigdata.ci.components/v1
bigtop_ref: branch-3.6
bigtop_version: 3.6.0
ambari_ref: release-3.0.0
ambari_version: 3.0.0
os_image: openeuler/openeuler:22.03-lts-sp4
jdk: 8

components:
  zookeeper:
    version: 3.8.4
    runtime_packages:
      - zookeeper
      - zookeeper-native
      - zookeeper-rest
      - zookeeper-server
    build_task: zookeeper-rpm
    wave: 1
    depends_on: []
  hadoop:
    version: 3.4.3
    runtime_packages:
      - hadoop
      - hadoop-client
      - hadoop-conf-pseudo
      - hadoop-hdfs
      - hadoop-hdfs-datanode
      - hadoop-hdfs-dfsrouter
      - hadoop-hdfs-fuse
      - hadoop-hdfs-journalnode
      - hadoop-hdfs-namenode
      - hadoop-hdfs-secondarynamenode
      - hadoop-hdfs-zkfc
      - hadoop-httpfs
      - hadoop-kms
      - hadoop-libhdfs
      - hadoop-libhdfspp
      - hadoop-mapreduce
      - hadoop-mapreduce-historyserver
      - hadoop-yarn
      - hadoop-yarn-nodemanager
      - hadoop-yarn-proxyserver
      - hadoop-yarn-resourcemanager
      - hadoop-yarn-router
      - hadoop-yarn-timelineserver
    build_task: hadoop-rpm
    wave: 2
    depends_on:
      - zookeeper
  tez:
    version: 0.10.5
    runtime_packages:
      - tez
    build_task: tez-rpm
    wave: 3
    depends_on:
      - hadoop
  hive:
    version: 4.0.1
    runtime_packages:
      - hive
      - hive-hbase
      - hive-hcatalog
      - hive-hcatalog-server
      - hive-jdbc
      - hive-metastore
      - hive-server2
      - hive-webhcat
      - hive-webhcat-server
    build_task: hive-rpm
    wave: 3
    depends_on:
      - hadoop
      - tez
  spark:
    version: 3.5.8
    runtime_packages:
      - spark
      - spark-core
      - spark-datanucleus
      - spark-external
      - spark-history-server
      - spark-master
      - spark-python
      - spark-sparkr
      - spark-thriftserver
      - spark-worker
      - spark-yarn-shuffle
    build_task: spark-rpm
    wave: 4
    depends_on:
      - hadoop
  hbase:
    version: 2.6.5
    runtime_packages:
      - hbase
      - hbase-master
      - hbase-regionserver
      - hbase-rest
      - hbase-thrift
      - hbase-thrift2
    build_task: hbase-rpm
    wave: 5
    depends_on:
      - hadoop
      - zookeeper
