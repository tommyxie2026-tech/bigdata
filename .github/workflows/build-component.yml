name: Build Component

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: Rebuild even when the exact tested RPM repository is current
        type: boolean
        default: false

  push:
    branches:
      - main
      - bigdata-1.0-rc1-openeuler22-rpm
    paths:
      - ".github/workflows/build-component.yml"
      - "scripts/ci/build-zookeeper-rpm-openeuler-container.sh"
      - "scripts/ci/retry-maven-downloads.sh"
      - "scripts/ci/configure-maven-policy.py"
      - "scripts/ci/run-with-deadline.py"
      - ".github/actions/*-build-dependencies/**"
      - "scripts/ci/test-zookeeper-rpm-openeuler-container.sh"
      - "packaging/bigtop/**"

permissions:
  contents: read

concurrency:
  group: build-component-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repo_check:
    if: inputs.force_build != true
    uses: ./.github/workflows/check-component-repo.yml
    with:
      component: zookeeper
      version: '3.8.4'

  build-zookeeper:
    needs: repo_check
    if: ${{ always() && (inputs.force_build == true || (needs.repo_check.result == 'success' && needs.repo_check.outputs.already_current != 'true')) }}
    name: ZooKeeper RPM on openEuler container
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      BIGTOP_REF: branch-3.6
      COMPONENT: zookeeper
      WORK_ROOT: /tmp/bigdata-bigtop-build
      OPENEULER_IMAGE: openeuler/openeuler:22.03-lts-sp4
      MAVEN_MIRROR_URL: ${{ vars.MAVEN_MIRROR_URL }}
      MAVEN_NETWORK_MODE: ${{ vars.MAVEN_NETWORK_MODE || 'online' }}

    steps:
      - name: Checkout BIGDATA
        uses: actions/checkout@v4

      - name: Runner capacity
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          docker version
          df -h
          free -h

      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${WORK_ROOT}"
          mkdir -p "${WORK_ROOT}"

      - name: Pull openEuler build image
        shell: bash
        run: |
          set -euo pipefail
          docker pull "${OPENEULER_IMAGE}"
          docker image inspect "${OPENEULER_IMAGE}" \
            --format 'image={{.RepoTags}} digest={{.RepoDigests}}'

      - name: Restore dependency downloads
        id: dependencies
        uses: ./.github/actions/restore-build-dependencies
        with:
          component: zookeeper
          version: '3.8.4'
          jdk: '8'

      - name: Build ZooKeeper RPM in openEuler
        id: build
        timeout-minutes: 160
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --init \
            -e MAVEN_MIRROR_URL -e MAVEN_NETWORK_MODE \
            --name bigdata-bigtop-zookeeper-build \
            -e BIGTOP_REF="${BIGTOP_REF}" \
            -e COMPONENT="${COMPONENT}" \
            -e WORK_ROOT=/work \
            -v "${GITHUB_WORKSPACE}:/workspace:ro" \
            -v "${WORK_ROOT}:/work" \
            -v /tmp/bigdata-component-cache/m2:/root/.m2 \
            -v /tmp/bigdata-component-cache/gradle:/root/.gradle \
            "${OPENEULER_IMAGE}" \
            bash /workspace/scripts/ci/build-zookeeper-rpm-openeuler-container.sh

      - name: Save newly downloaded dependencies
        if: ${{ always() && steps.dependencies.outcome == 'success' && (steps.build.outcome == 'success' || steps.build.outcome == 'failure') }}
        uses: ./.github/actions/save-build-dependencies
        with:
          key: ${{ steps.dependencies.outputs.key }}

      - name: Validate host-side artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find "${WORK_ROOT}" -maxdepth 4 -type f -print 2>/dev/null | sort || true

          if [[ -d "${WORK_ROOT}/artifacts/rpms" ]]; then
            rpm_count=$(find "${WORK_ROOT}/artifacts/rpms" -type f -name '*.rpm' | wc -l)
          else
            rpm_count=0
          fi

          echo "rpm_count=${rpm_count}" >> "${GITHUB_STEP_SUMMARY}"

          if [[ -f "${WORK_ROOT}/artifacts/evidence/evidence.md" ]]; then
            cat "${WORK_ROOT}/artifacts/evidence/evidence.md" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zookeeper-3.8.4-bigtop-3.6-openeuler22-rpm
          path: /tmp/bigdata-bigtop-build/artifacts
          if-no-files-found: error
          retention-days: 14

