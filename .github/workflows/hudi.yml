name: Hudi 1.2.1 Build and Test

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/hudi.yml"
      - ".github/workflows/component-lifecycle.yml"
      - ".github/workflows/build-one-component.yml"
      - ".github/workflows/test-components.yml"
      - ".github/workflows/release-components.yml"
      - "ci/components.yaml"
      - "scripts/ci/build-hudi-rpm-openeuler-container.sh"
      - "scripts/ci/test-hudi-rpm-openeuler-container.sh"
      - "scripts/ci/resolve-component-adapter.py"
      - "scripts/ci/resolve-component-dependencies.py"
      - "scripts/ci/validate-components.py"
      - "scripts/ci/retry-maven-downloads.sh"
  push:
    branches: [main]
    paths:
      - ".github/workflows/hudi.yml"
      - ".github/workflows/component-lifecycle.yml"
      - ".github/workflows/build-one-component.yml"
      - ".github/workflows/test-components.yml"
      - ".github/workflows/release-components.yml"
      - "ci/components.yaml"
      - "scripts/ci/build-hudi-rpm-openeuler-container.sh"
      - "scripts/ci/test-hudi-rpm-openeuler-container.sh"
      - "scripts/ci/resolve-component-adapter.py"
      - "scripts/ci/resolve-component-dependencies.py"
      - "scripts/ci/validate-components.py"
      - "scripts/ci/retry-maven-downloads.sh"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: hudi-1.2.1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hudi:
    name: Hudi 1.2.1 Build RPM and Spark/Flink integration test
    permissions:
      contents: write
      actions: read
      pull-requests: write
    uses: ./.github/workflows/component-lifecycle.yml
    with:
      component: hudi
      version: '1.2.1'
      builder: custom
      artifact_type: integration-rpm
      build_task: hudi-rpm
      test_profile: hudi-cross-engine-smoke
      jdk: '11'
      jdk_package: java-11-openjdk-devel
      source_identity: a9185b7c4e83422132c25f2efdf282c5bc6af2c7
      require_pr_build_test: true
