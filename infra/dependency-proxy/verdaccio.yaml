storage: /verdaccio/storage
listen: 0.0.0.0:4873
url_prefix: /npm/
auth:
  htpasswd:
    file: /verdaccio/storage/htpasswd
    max_users: -1
uplinks:
  npmjs:
    url: https://registry.npmjs.org/
    cache: true
    timeout: 15s
    maxage: 1d
    max_fails: 2
    fail_timeout: 1m
packages:
  '@*/*':
    access: $all
    publish: []
    unpublish: []
    proxy: npmjs
  '**':
    access: $all
    publish: []
    unpublish: []
    proxy: npmjs
log:
  type: stdout
  format: pretty
  level: warn
